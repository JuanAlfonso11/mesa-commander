function connectToHost(){
 if(!peer||peer.destroyed){peer=new Peer();peer.on('error',e=>{if(!everWelcomed){error(e);return;}if(e?.type==='peer-unavailable'){scheduleRetry();return;}error(e);if(!server?.open)scheduleRetry();});peer.on('disconnected',()=>{if(!closing&&peer&&!peer.destroyed)try{peer.reconnect();}catch{}});}
 const go=()=>{const conn=peer.connect('mesa-v1-'+room,{reliable:true,serialization:'json'});server=conn;const unpack=assembler();
  conn.on('open',()=>{lastFromHost=now();safeSend(conn,{type:'hello',name:joinConfig.name,deck:joinConfig.deck,token:reconnectToken});});
  conn.on('data',raw=>{if(conn!==server)return;lastFromHost=now();const d=unpack(raw);if(!d||typeof d!=='object')return;
   if(d.type==='ping'){safeSend(conn,{type:'pong',t:d.t});return;}
   if(d.type==='welcome'){everWelcomed=true;myId=d.id;reconnectToken=d.token;saveToken(room,d.token);store.set(GUEST_KEY,{room,name:joinConfig.name,id:d.id,savedAt:now()});const wasRetry=retry.active;stopRetry();emit('welcome',d.id);emit('connected',room);if(wasRetry)emit('status','Reconectado a la sala '+room+'.');for(const a of pending.values())safeSend(conn,{type:'action',action:a});}
   if(d.type==='state'){started=true;emit('state',d.state);}
   if(d.type==='ack')pending.delete(d.id);
   if(d.type==='roster')emit('roster',d.players);
   if(d.type==='error'){if(d.id)pending.delete(d.id);emit('error',d.message);}
   if(d.type==='chat')emit('chat',d.message);if(d.type==='peek')emit('peek',d.cards);});
  conn.on('close',()=>{if(conn!==server||closing)return;if(!everWelcomed){emit('disconnected','La sala cerró la conexión.');return;}emit('disconnected','Se perdió la conexión con el anfitrión. Reintentando…');scheduleRetry();});
  conn.on('error',()=>{if(conn===server&&!conn.open)scheduleRetry();});
 };
 if(peer.open)go();else peer.on('open',go);
}
function scheduleRetry(){if(closing||host||!joinConfig||!everWelcomed)return;if(retry.timer)return;if(retry.n>=MAX_RETRY){retry.active=false;emit('disconnected','No se pudo volver a la sala. Pulsa Reconectar cuando el anfitrión vuelva.');return;}retry.active=true;const wait=Math.min(20000,1500*2**retry.n);retry.n++;emit('status','Reconectando con el anfitrión (intento '+retry.n+')…');retry.timer=setTimeout(()=>{retry.timer=null;try{server?.close();}catch{}if(peer&&(peer.destroyed||peer.disconnected)){try{peer.destroy();}catch{}peer=null;}connectToHost();},wait);}
function guestWatchdog(){stopEvery(beat);beat=every(()=>{if(host||!server)return;if(server.open&&now()-lastFromHost>20000){try{server.close();}catch{}scheduleRetry();}},5000);}
async function join(code,config,on){reset();callbacks=on;room=String(code||'').toUpperCase().replace(/[^A-Z2-9]/g,'');if(room.length!==8)throw Error('El código tiene 8 letras o números.');joinConfig={name:config.name,deck:config.deck};await loadPeer();reconnectToken=tokenFor(room);connectToHost();guestWatchdog();timer=setTimeout(()=>{if(!server?.open&&!retry.active)emit('error','La sala no respondió. Verifica el código; algunas redes móviles bloquean WebRTC.');},18000);}
// Reintento manual (botón Reconectar).
function rejoin(){if(host||!room||!joinConfig)throw Error('No hay una sala de invitado que reconectar.');stopRetry();try{server?.close();}catch{}try{peer?.destroy();}catch{}peer=null;connectToHost();}
function start(){if(!host||started)throw Error('No puedes iniciar esta sala.');game=MC.createGame({players:seats,mode:'online'});started=true;broadcast();return game;}
function action(a){if(host){const r=MC.dispatch(game,a);if(!r.ok)throw Error(r.error);game=r.state;broadcast();}else{pending.set(a.id,a);if(pending.size>50)pending.delete(pending.keys().next().value);if(!server?.open){scheduleRetry();throw Error('Sin conexión al anfitrión. Tu acción se enviará al reconectar.');}safeSend(server,{type:'action',action:a});}}
function sync(s){if(!host)throw Error('Solo el anfitrión puede sincronizar.');game=s;broadcast();}
function chat(text){if(host){const m={name:seats[0].name,text:String(text).slice(0,400),at:now()};emit('chat',m);for(const x of links.values())safeSend(x.conn,{type:'chat',message:m});}else safeSend(server,{type:'chat',text});}
function peek(){if(host)emit('peek',game.players.find(p=>p.id==='p1').library);else safeSend(server,{type:'peek'});}
function forget(){store.del(HOST_KEY);store.del(GUEST_KEY);}
root.MN={create,join,resumeHost,rejoin,start,action,sync,chat,peek,reset,forget,savedHost:()=>store.get(HOST_KEY),savedGuest:()=>store.get(GUEST_KEY),get isHost(){return host;},get room(){return room;},get myId(){return host?'p1':myId;},get connected(){return host?!!peer?.open:!!server?.open;},get reconnecting(){return retry.active;},get pendingCount(){return pending.size;}};
})(globalThis);
</script><script>(function(){'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='mesa-commander-v1';let db;try{db=JSON.parse(localStorage.getItem(key));}catch{}if(!db||db.version!==1)db={version:1,name:'',decks:MD.defaultDecks(),history:[],tournaments:[],saved:null};
let route=location.hash.slice(1).split('?')[0]||'inicio',editing=null,results=[],game=null,actor='p1',online=false,lobby=null,chats=[],privateLibrary=[],selectedCard=null,selectedZone=null,selectedOwner=null,installPrompt=null,toastTimer,pendingAutoPay=null;

function imgURL(c,art=false){if(c?.token&&!c?.image_uris)return '';const key=art?'art_crop':'normal',starter=globalThis.MESA_ART?.[c?.name];let x=(c?.localReference||!c?.image_uris?.normal)&&starter?starter[key]:c?.image_uris?.[key];if(!x&&MD.imageURLs)x=MD.imageURLs(c||{})[key];if(/^\.\/cards\/[a-z0-9-]+\.jpg$/.test(x||''))return x;try{return new URL(x).protocol==='https:'?x:'';}catch{return '';}}

function render(){if(!routes[route])route='inicio';$('#nav').innerHTML=Object.entries(routes).map(([id,name])=>`<button class="${route===id?'active':''}" data-action="nav" data-route="${id}">${icon(id)}<span>${name}</span></button>`).join('');$('#page-name').textContent=routes[route];$('#profile-name').textContent=db.name||'Planeswalker';$('#online-status').textContent=online?MN.connected?'Sala '+MN.room+(MN.pendingCount?' · enviando…':''):MN.reconnecting?'Reconectando…':'Conexión interrumpida':navigator.onLine?'Modo local disponible':'Sin conexión · modo local';$('#content').innerHTML=({inicio:home,decks:decks,mesa:table,aprender:learn,historial:history,torneos:tournaments}[route])();}
function home(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow">EL MULTIVERSO SE SIENTA A TU MESA</span><h1>Tu comandante.<br>Tu gente. Tu partida.</h1><p>Reúne a tus amigos, despliega tu estrategia y deja que cada partida cuente una historia.</p><div class="row">${button('＋ Crear una mesa','newgame','','primary')}${button('Unirme con código →','join','','ghost')}</div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="hero-card"><img src="./cards/talrand.jpg" alt="Talrand, Sky Summoner"></div><div class="hero-card second"><img src="./cards/rat-colony.jpg" alt="Rat Colony"></div><div class="hero-card front"><img src="./cards/marrow-gnawer.jpg" alt="Marrow-Gnawer"></div><span class="hero-caption">100 CARTAS · 40 VIDAS · INFINITAS HISTORIAS</span></div></section><div class="grid3" style="margin-top:18px"><button class="panel quick" data-action="practice"><span class="iconbox">${icon('mesa')}</span><span><strong>Prueba tu estrategia</strong><small>Una partida local contra bots</small></span><span class="arrow">↗</span></button><button class="panel quick" data-action="import"><span class="iconbox">${icon('decks')}</span><span><strong>Trae tu deck</strong><small>Archidekt, Arena o una lista de cartas</small></span><span class="arrow">↗</span></button><button class="panel quick" data-action="nav" data-route="aprender"><span class="iconbox">${icon('aprender')}</span><span><strong>Resuelve esa duda</strong><small>Reglas y palabras clave en español</small></span><span class="arrow">↗</span></button></div>${!online&&MN.savedHost()?.room?`<div class="panel row between" style="margin-top:18px"><span><strong>Tu sala ${esc(MN.savedHost().room)} sigue guardada</strong><br><small>Reábrela con el mismo código: tus amigos vuelven a su asiento solos.</small></span><div class="row">${button('Reabrir sala','reopen-room','','primary')}${button('Olvidar','forget-room','','ghost')}</div></div>`:''}${!online&&MN.savedGuest()?.room&&!MN.savedHost()?.room?`<div class="panel row between" style="margin-top:18px"><span><strong>Estabas en la sala ${esc(MN.savedGuest().room)}</strong><br><small>Vuelve a tu asiento desde este navegador.</small></span>${button('Volver a la sala','guest-return','','primary')}</div>`:''}${db.saved?`<div class="panel row between" style="margin-top:18px"><span><strong>Tu mesa te está esperando</strong><br><small>Guardado local · turno ${db.saved.turn} · ${db.saved.players.length} jugadores</small></span>${button('Retomar partida','resume','','primary')}</div>`:''}<div class="section-head"><h2>Tus próximos aliados</h2>${button('Ver mis decks →','nav','data-route="decks"','ghost')}</div><div class="grid3 deck-grid">${db.decks.slice(0,3).map(deckCard).join('')}${db.decks.length<3?`<button class="empty" data-action="newdeck"><span style="font-size:32px;color:var(--gold)">＋</span><h3 style="margin-top:16px">Una nueva estrategia</h3><p class="small">Elige un comandante.<br>Construye algo tuyo.</p></button>`:''}</div><div class="grid2" style="margin-top:22px"><div class="note"><strong class="gold">Mesa libre, como en papel.</strong><br>Tú decides las acciones. La app lleva la cuenta y te ayuda; los efectos complejos se resuelven a mano.</div><div class="note"><strong class="gold">Listo para practicar sin conexión.</strong><br>Incluye dos listas de laboratorio. Importa tus propios decks para jugar tu estrategia habitual.</div></div>${footer()}`;}
function footer(){return '<div class="footer-note"><span>MESA COMMANDER · HECHO PARA COMPARTIR LA MESA</span><span>Proyecto de fans · sin afiliación con Wizards of the Coast</span></div>';}
function decks(){if(editing)return editor();return `<div class="section-head" style="margin-top:0"><div><span class="eyebrow">TU ARSENAL</span><h2 style="margin-top:8px">Mis decks</h2></div><div class="row">${button('Importar','import')}${button('＋ Nuevo deck','newdeck','','primary')}</div></div><p>Cada deck, una forma distinta de jugar. Se guardan en este navegador.</p><div class="grid3 deck-grid">${db.decks.map(deckCard).join('')}</div><div class="panel" style="margin-top:22px"><h3>Descubre tu próxima idea</h3><p class="small">Explora las listas públicas en su sitio y tráelas por enlace de Archidekt o texto exportado. Los decks privados requieren acceso en la plataforma original.</p><div class="row"><a href="https://archidekt.com/search/decks" target="_blank" rel="noopener noreferrer">Explorar Archidekt ↗</a><a href="https://edhrec.com/commanders" target="_blank" rel="noopener noreferrer">Comandantes en EDHREC ↗</a><a href="https://moxfield.com" target="_blank" rel="noopener noreferrer">Moxfield ↗</a></div></div>${footer()}`;}
function grouped(cards){const m=new Map();cards.forEach((c,i)=>{const k=c.name;if(!m.has(k))m.set(k,{c,n:0,index:i});m.get(k).n++;});return [...m.values()];}
function editor(){const d=deckBy(editing);if(!d){editing=null;return decks();}const validation=MC.validateDeck(d);return `<div class="section-head" style="margin-top:0"><div><span class="eyebrow">CONSTRUCTOR</span><h2 style="margin-top:8px">${esc(d.name)}</h2></div>${button('← Mis decks','backdecks')}</div><div class="grid2"><section class="panel"><div class="row between"><h3>${d.cards.length+(d.commander?1:0)} / 100 cartas</h3><span class="badge">${validation.valid?'Validación básica correcta':'En construcción'}</span></div><label>Nombre del deck</label><div class="searchrow"><input id="deck-name" value="${esc(d.name)}" maxlength="70">${button('Guardar','rename')}</div><div class="note" style="margin-top:16px"><strong>Comandante:</strong> ${esc(d.commander?.name||'Busca una criatura legendaria y pulsa Comandante.')}</div><div style="margin-top:15px;max-height:390px;overflow:auto">${grouped(d.cards).map(x=>`<div class="list-row"><span class="gold">${x.n}×</span><span class="name">${esc(cardName(x.c))}</span>${button('◈','deck-detail',`data-index="${x.index}" aria-label="Ver ${esc(x.c.name)}"`)}${button('−','remove-card',`data-index="${x.index}" aria-label="Quitar ${esc(x.c.name)}"`)}</div>`).join('')||'<p>Añade tus primeras cartas desde el buscador.</p>'}</div><div class="row" style="margin-top:18px">${button('Validar','validate')}${button('Exportar lista','export-deck')}${button('Eliminar','delete-deck','','danger')}${d.source?button('Actualizar Archidekt','refresh-deck'):''}</div></section><section><div class="panel"><h3>Encuentra una carta</h3><div class="searchrow"><input id="card-query" placeholder="Nombre o consulta Scryfall…" aria-label="Buscar cartas"><select id="card-lang" style="width:110px"><option value="en">Inglés</option><option value="es">Español</option></select>${button('Buscar','search','','primary')}</div><p class="small" style="margin:12px 0 0">Consulta Scryfall. Las cartas ya guardadas también aparecen sin internet.</p></div><div id="search-results" class="results">${resultsHTML()}</div></section></div>`;}

function networkCallbacks(){return {connected:r=>{online=true;toast('Conectado a la sala '+r);go('mesa');},welcome:id=>{actor=id;},roster:p=>{lobby=p;if(route==='mesa')render();},state:s=>{game=s;online=true;if(MN.isHost){db.saved=s;save();}if(route==='mesa')render();},error:toast,status:msg=>{toast(msg);render();},disconnected:msg=>{toast(msg);render();},chat:m=>{chats.push(m);chats=chats.slice(-100);if(route==='mesa')render();},peek:cards=>{privateLibrary=cards;libraryModal();}};}

function opponentSeat(q){return `<article class="opponent-seat ${q.id===game.activePlayerId?'current':''}"><header class="seat-header"><div><span class="seat-status">${q.id===game.activePlayerId?'● TURNO ACTIVO':q.bot?'BOT':'OPONENTE'}</span><strong>${esc(q.name)}</strong></div>${seatLife(q)}</header><div class="opponent-counts"><span title="Cartas en mano">▱ Mano <b>${q.handCount??q.hand.length}</b></span><span title="Cartas en biblioteca">▤ Mazo <b>${q.libraryCount??q.library.length}</b></span><span title="Cementerio">◇ <b>${q.graveyard.length}</b></span><span title="Veneno">☣ <b>${q.poison}</b></span>${button('Detalles','player-info',`data-player="${esc(q.id)}"`,'ghost')}</div><div class="opponent-field"><div class="opponent-command"><span class="micro-label">Mando</span>${q.command.map((c,i)=>playcard(c,'command',i,q.id)).join('')||'<span class="empty-command" aria-label="Comandante en otra zona">◇</span>'}</div><div class="opponent-battle"><span class="micro-label">Campo · ${q.battlefield.length}</span><div class="card-strip">${q.battlefield.map((c,i)=>playcard(c,'battlefield',i,q.id)).join('')||'<div class="opponent-empty">Sin permanentes</div>'}</div></div></div>${q.eliminated?'<span class="warning small">Umbral de derrota alcanzado</span>':''}</article>`;}
function fieldLane(p,kind,label,hint){const cards=p.battlefield.map((c,i)=>({c,i})).filter(({c})=>kind==='creatures'?/Creature/.test(c.type_line||''):kind==='lands'?/Land/.test(c.type_line||'')&&!/Creature/.test(c.type_line||''):!/Creature|Land/.test(c.type_line||''));return `<section class="field-lane lane-${kind}" data-field-row="${kind}"><header><span>${label}</span><span class="lane-count">${cards.length}</span></header><div class="card-strip">${cards.map(({c,i})=>playcard(c,'battlefield',i,p.id)).join('')||`<div class="lane-empty"><span aria-hidden="true">${kind==='creatures'?'⚔':kind==='lands'?'◈':'✧'}</span><small>${hint}</small></div>`}</div></section>`;}
function publicPile(p,zone,label,symbol){const top=p[zone].at(-1),art=top?imgURL(top):'';return `<button class="zone-pile ${zone}" data-action="zone" data-zone="${zone}" aria-label="Abrir ${label}, ${p[zone].length} cartas"><span class="pile-label">${label}</span><span class="pile-visual">${art?`<img src="${esc(art)}" alt="${esc(cardName(top))}" loading="lazy">`:`<span class="pile-empty-symbol" aria-hidden="true">${symbol}</span>`}<span class="pile-count">${p[zone].length}</span></span><small>${top?esc(cardName(top)):'Sin cartas'}</small></button>`;}
function tablePrefs(){return {size:['small','normal','large'].includes(db.tablePrefs?.size)?db.tablePrefs.size:'normal',handFolded:db.tablePrefs?.handFolded===true};}
function poolText(pool){return MC.COLORS.filter(c=>pool[c]).map(c=>`${pool[c]} {${c}}`).join(' · ')||'Vacía';}
function responsePanel(){const r=MC.responseStatus(game);return `<div class="response-panel"><div class="row between"><strong>Ronda de respuestas</strong>${button(r.enabled?'Desactivar':'Activar','response-mode',`${canControl(game.activePlayerId)?'':'disabled'} data-enabled="${!r.enabled}"`,'ghost')}</div><small>Confirmaciones opcionales para el hechizo superior. No valida todas las reglas de prioridad.</small>${r.enabled&&r.spellId?game.players.filter(q=>r.pendingIds.includes(q.id)||r.passedIds.includes(q.id)).map(q=>`<div class="response-seat"><span>${r.passedIds.includes(q.id)?'✓':'…'} ${esc(q.name)}</span>${canControl(q.id)?button(r.passedIds.includes(q.id)?'Retirar pase':q.bot?'Confirmar bot':'Paso','response-pass',`data-player="${esc(q.id)}" data-pass="${!r.passedIds.includes(q.id)}"`,'ghost'):''}</div>`).join(''):''}</div>`;}
function tablePrompt(){const r=MC.responseStatus(game);let message;if(game.stack.length)message=r.enabled?(r.ready?'Todos confirmaron. El jugador activo puede resolver el hechizo superior.':'Esperando respuestas: '+game.players.filter(q=>r.pendingIds.includes(q.id)).map(q=>q.name).join(', ')+'. Puedes lanzar una respuesta desde tu mano.'):'Hay un hechizo en la pila. Acuerden las respuestas antes de resolver.';else if(game.pendingCombat)message='Combate pendiente: acuerden bloqueos y confirmen el daño.';else message=MC.PHASES[game.phase]+': '+['Endereza, revisa el mantenimiento y roba cuando corresponda.','Juega tu tierra y prepara tus hechizos.','Elige atacantes y acuerda los bloqueos.','Puedes jugar permanentes y preparar tu siguiente turno.','Revisa habilidades del paso final.','Ajusta la mano y el daño temporal antes de pasar.'][game.phase];return `<div class="table-prompt" role="status"><span aria-hidden="true">◈</span><div><strong>¿Qué sigue?</strong><p>${esc(message)}</p></div></div>`;}
function autoPayModal(c,zone,owner){const p=game.players.find(q=>q.id===owner),plan=MC.autoPaymentPlan(game,owner,c.iid,zone);pendingAutoPay={owner,iid:c.iid,from:zone,landIds:plan.landIds,revision:game.revision};modal('Revisar pago automático',`<h3>${esc(cardName(c))}</h3><p>Coste impreso: ${esc(c.mana_cost||'Sin coste')} · Impuesto: ${plan.tax}</p><p class="small">Usa primero tu reserva y después tus fuentes de maná (tierras básicas, duales y artefactos sencillos). Comprueba descuentos, aumentos y otras condiciones de la mesa; no se calculan automáticamente.</p>${plan.ok?`<h4>Fuentes que se girarán · ${plan.landIds.length}</h4><div class="payment-sources">${plan.landIds.map(id=>{const land=p.battlefield.find(x=>x.iid===id);return `<div>${imgURL(land)?`<img src="${esc(imgURL(land))}" alt="${esc(cardName(land))}">`:''}<span>${esc(cardName(land))} → +${'{'+(plan.colors?.[id]?.color||MC.simpleLandMana(land))+'}'.repeat(plan.colors?.[id]?.amount||1)}</span></div>`;}).join('')||'<p>No hace falta girar tierras.</p>'}</div><p>Reserva actual: <b>${esc(poolText(plan.manaBefore))}</b><br>Reserva después: <b>${esc(poolText(plan.manaAfter))}</b></p><div class="row modal-actions">${button('Confirmar pago y lanzar','auto-cast-confirm','','primary')}</div>`:`<p class="note warning">${esc(plan.reason)}</p>`}<div class="spacer"></div>${button('Volver a la carta','auto-cast-back','','ghost')}`);}
function tableSummary(){modal('Resumen de la mesa',`<p>Daño de comandante recibido por jugador. Cada columna identifica al controlador del comandante de origen; comandantes múltiples requieren registro manual separado.</p><div class="summary-scroll"><table class="game-summary"><thead><tr><th>Jugador</th><th>Vidas</th><th>Veneno</th><th>Mano</th>${game.players.map(q=>`<th>De ${esc(q.name)}</th>`).join('')}</tr></thead><tbody>${game.players.map(p=>`<tr><th>${esc(p.name)}</th><td>${p.life}</td><td>${p.poison}</td><td>${p.handCount??p.hand.length}</td>${game.players.map(q=>`<td>${p.id===q.id?'—':p.commanderDamage[q.id]||0}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">21 de daño de un mismo comandante alcanza el umbral de derrota. Este contador no modifica vidas; ajusta ambas cifras desde Detalles del jugador.</p>`);}
function table(){if(online&&!game)return `<div class="section-head" style="margin-top:0"><h2>La mesa está abierta</h2><span class="badge">Sala online</span></div><div class="panel"><span class="eyebrow">COMPARTE ESTE CÓDIGO</span><div class="stat" style="letter-spacing:7px">${esc(MN.room)}</div><div class="row">${button('Copiar código','copy-room')}${button('Salir de la sala','leave-online','','ghost')}</div><div class="spacer"></div><div class="player-grid">${(lobby||[]).map(p=>`<div class="player"><strong>${esc(p.name)}</strong><p class="small">${p.bot?'Asiento libre · bot al iniciar':p.connected?'Conectado':'Desconectado'}</p></div>`).join('')}</div><p style="margin-top:18px">Los asientos libres se completarán con bots. Una vez iniciada la mesa, solo podrán reconectar los participantes originales.</p>${MN.isHost?button('Comenzar partida','start-online','','primary'):'<p class="gold">Esperando al anfitrión…</p>'}</div>`;
if(!game)return `<div class="section-head" style="margin-top:0"><h2>Tu próxima partida empieza aquí</h2></div><div class="empty"><span style="font-size:55px;color:var(--gold)">◇</span><h2>Hay un lugar para ti</h2><p>Invita a tus amigos o practica contra bots.<br>La mesa lleva las cuentas; tú haces la magia.</p><div class="row" style="justify-content:center">${button('Crear mesa','newgame','','primary')}${button('Unirme','join')}${db.saved?button('Retomar guardado','resume'):''}</div></div>`;
const p=game.players.find(p=>p.id===actor)||game.players[0],active=game.players.find(p=>p.id===game.activePlayerId);return `<div class="table-view cards-${tablePrefs().size}"><header class="table-heading"><div><span class="eyebrow">${online?'SALA '+esc(MN.room):'MESA LOCAL'} · TURNO ${game.turn}</span><h2>${esc(active.name)} tiene el turno</h2></div><div class="row table-toolbar">${online&&!MN.isHost&&!MN.connected?button('↻ Reconectar','rejoin','','primary'):''}${button('✦ Tips','table-tips','','tips-button')}${button('Vista','table-view-settings','','ghost')}${button('Resumen','table-summary','','ghost')}${button('Guardar / salir','pause')}${button('Finalizar','endgame','','ghost')}</div></header><div class="table-turnbar"><div class="phasebar" aria-label="Fases del turno">${MC.PHASES.map((f,i)=>`<span class="${game.phase===i?'active':''}" ${game.phase===i?'aria-current="step"':''}>${i+1}<b>${esc(f)}</b></span>`).join('')}</div><div class="turn-actions">${canControl(active.id)?active.bot?button('▶ Turno del bot','botturn','','primary'):button('Siguiente fase →','phase','','primary'):''}${canControl(active.id)?button('Pasar turno','turn','','ghost'):''}</div></div>${tablePrompt()}${game.winnerId?`<div class="note table-result">${esc(game.players.find(q=>q.id===game.winnerId).name)} es el último jugador con vida. Finaliza la partida para guardar el resultado.</div>`:''}${game.pendingCombat?combatPanel():''}<div class="commander-playmat"><div class="opponents-row" aria-label="Oponentes y campos públicos">${game.players.filter(q=>q.id!==actor).map(opponentSeat).join('')||'<div class="solo-banner">PRÁCTICA EN SOLITARIO · TU MESA, A TU RITMO</div>'}</div><div class="table-divider"><span>CAMPO DE BATALLA</span><span class="divider-sigil" aria-hidden="true">✦</span><span>COMMANDER · MESA LIBRE</span></div><div class="own-seat-header"><div class="own-identity"><span class="seat-status">${p.id===active.id?'● TU TURNO':'TU ASIENTO'}</span><strong>${esc(p.name)}</strong><small>☣ ${p.poison} veneno · ${p.battlefield.length} permanentes</small></div>${seatLife(p)}<div class="own-seat-actions">${button('Detalles','player-info',`data-player="${esc(p.id)}"`,'ghost')}${!online?`<select id="actor-select" aria-label="Jugador controlado">${game.players.map(q=>`<option value="${esc(q.id)}" ${q.id===actor?'selected':''}>Controlar: ${esc(q.name)}</option>`).join('')}</select>`:''}</div>${p.eliminated?'<span class="warning small">Umbral de derrota alcanzado</span>':''}</div><div class="playmat-layout"><aside class="zone-rail" aria-label="Tus zonas"><section class="library-slot"><span class="pile-label">Biblioteca</span><button class="library-back" data-action="draw" aria-label="Robar carta de tu biblioteca"><span class="back-ornament" aria-hidden="true">✦</span><strong>${p.libraryCount??p.library.length}</strong><small>ROBAR CARTA</small></button>${button('Buscar','library','','ghost')}</section><section class="command-slot"><span class="pile-label">Zona de mando</span><div class="command-card">${p.command.map((c,i)=>playcard(c,'command',i,p.id)).join('')||'<div class="empty-command"><span>◇</span><small>En otra zona</small></div>'}</div><small class="commander-tax">Impuesto <b>+${p.commanderCasts*2}</b></small></section>${publicPile(p,'graveyard','Cementerio','◇')}${publicPile(p,'exile','Exilio','✧')}</aside><div class="your-field"><div class="field-heading"><h3>Tu campo</h3><div class="row">${button('＋ Ficha','token','','ghost')}${button('⚔ Atacar','attack',`${game.activePlayerId!==actor?'disabled':''}`)}</div></div>${fieldLane(p,'creatures','Criaturas','Tus criaturas se despliegan aquí')}<div class="support-lanes">${fieldLane(p,'lands','Tierras','Tu base de maná')}${fieldLane(p,'other','Otros permanentes','Artefactos, encantamientos y más')}</div><p class="field-guidance">Toca una carta para girarla, lanzarla o moverla de zona.</p></div><aside class="table-tools"><section class="mana-station"><div class="station-heading"><h3>Reserva de maná</h3>${button('Ajustar','mana-adjust','','ghost')}</div><div class="mana-grid">${MC.COLORS.map(c=>`<button data-action="mana" data-color="${c}" aria-label="Añadir maná ${c}; reserva ${p.mana[c]}"><span class="mana ${c}">${c}</span><b>${p.mana[c]}</b><span class="mana-plus">＋</span></button>`).join('')}</div><small>Girar una tierra sencilla añade su maná automáticamente. Los botones de colores son ajustes manuales.</small></section><section class="stack-station"><div class="station-heading"><h3>La pila</h3><span class="stack-total">${game.stack.length}</span></div><div class="spell-stack">${game.stack.slice().reverse().map((e,i)=>`<button class="stack-entry" data-action="stack-card" data-id="${esc(e.id)}">${imgURL(e.card,true)?`<img src="${esc(imgURL(e.card,true))}" alt="" loading="lazy">`:''}<div><small>${i===0?'PRÓXIMO EN RESOLVER':'EN ESPERA'}</small><strong>${esc(cardName(e.card))}</strong><span class="badge">${e.effectStatus==='supported'?'Asistido':'Manual'}</span></div></button>`).join('')||'<div class="stack-empty"><span aria-hidden="true">▱</span><strong>Pila vacía</strong><small>Los hechizos esperan aquí antes de resolverse.</small></div>'}</div>${game.stack.length?button('Resolver superior','resolve',canControl(active.id)&&MC.responseStatus(game).ready?'':'disabled','primary'):''}${responsePanel()}</section></aside></div><section class="hand-zone"><header><div><span class="eyebrow">TU MANO</span><strong>${p.hand.length} cartas <small>· privada en multijugador</small></strong></div><div class="row">${button(tablePrefs().handFolded?'Ver mano':'Ocultar mano','hand-fold',`aria-expanded="${!tablePrefs().handFolded}"`,'ghost')}${button('Mulligan','mulligan',`${game.turn!==1?'disabled':''}`,'ghost')}${button('Barajar','shuffle','','ghost')}</div></header>${tablePrefs().handFolded?'<div class="hand-folded">Mano oculta en este dispositivo. Pulsa «Ver mano» para desplegarla.</div>':`<div class="card-strip hand-cards">${p.hand.map((c,i)=>playcard(c,'hand',i,p.id)).join('')||'<div class="hand-empty">Tu mano está vacía. Roba una carta desde tu biblioteca cuando corresponda.</div>'}</div>`}</section><footer class="playmat-caption"><span>✦ MESA COMMANDER</span><small>Pago y efectos complejos: resolución manual</small></footer></div><div class="table-activity"><details class="activity-panel"><summary><span>Registro de la mesa</span><span>${game.log.length} eventos · ver actividad</span></summary><div class="log">${game.log.slice(-22).reverse().map(e=>`<p><span class="gold">T${e.turn}</span> ${esc(e.text)}</p>`).join('')}</div></details>${online?`<details class="activity-panel chat-panel" open><summary><span>Chat de la mesa</span><span>${chats.length} mensajes</span></summary><div class="log">${chats.map(m=>`<p><strong>${esc(m.name)}:</strong> ${esc(m.text)}</p>`).join('')||'<p>Di hola a tu mesa.</p>'}</div><div class="searchrow"><input id="chat-text" maxlength="400" placeholder="Tu mensaje…" aria-label="Mensaje">${button('↑','chat')}</div><div class="row">${['¡Buena jugada!','Tu turno','En respuesta…'].map(m=>button(esc(m),'emote',`data-text="${esc(m)}"`,'ghost')).join('')}</div></details>`:''}</div>${mobileDock(p,active)}</div>`;}

function mobileDock(p,active){const total=MC.COLORS.reduce((n,c)=>n+(p.mana[c]||0),0);let main='';if(game.pendingCombat&&canControl(game.pendingCombat.attackerId))main=button('⚔ Aplicar daño','combat-resolve','','primary');else if(game.stack.length&&canControl(active.id))main=button('Resolver','resolve',MC.responseStatus(game).ready?'':'disabled','primary');else if(canControl(active.id))main=active.bot?button('▶ Bot','botturn','','primary'):button('Fase →','phase','','primary');return `<nav class="mobile-dock" aria-label="Acciones rápidas"><span class="dock-phase"><small>T${game.turn} · ${esc(active.name)}</small><b>${esc(MC.PHASES[game.phase])}</b></span>${button('✋ '+p.hand.length,'jump','data-target=".hand-zone" aria-label="Ir a tu mano"','ghost')}${button('◈ '+total,'jump','data-target=".mana-station" aria-label="Ir a la reserva de maná"','ghost')}${game.stack.length?button('▱ '+game.stack.length,'jump','data-target=".stack-station" aria-label="Ir a la pila"','ghost'):''}${main}</nav>`;}
function canControl(id){return !online||id===actor||(MN.isHost&&game?.players.find(p=>p.id===id)?.bot);}
function playcard(c,zone,i,owner){const affordable=game&&owner===actor&&['hand','command'].includes(zone)&&MC.autoPaymentPlan(game,owner,c.iid,zone).ok;return `<button class="playcard ${c.tapped?'tapped':''} ${affordable?'affordable':''}" data-affordable="${!!affordable}" data-action="game-card" data-zone="${zone}" data-index="${i}" data-player="${esc(owner)}" aria-label="${esc(cardName(c))}${c.tapped?', girada':''}">${imgURL(c)?`<img src="${esc(imgURL(c))}" alt="${esc(cardName(c))}" loading="lazy">`:`<span class="fallback"><strong>${esc(cardName(c))}</strong><b>${/Land/.test(c.type_line)?'◈':'✦'}</b><small>${esc(c.mana_cost||c.type_line)}</small></span>`}${affordable?'<span class="affordable-label" title="Coste impreso cubierto con reserva y tierras simples. Revisa el momento legal y otros costes.">Maná disponible</span>':''}${c.tapped?'<span class="tapped-label">↷ GIRADA</span>':''}${c.power!==undefined&&c.power!==null?`<span class="card-mark">${esc(c.power)}/${esc(c.toughness)}</span>`:''}</button>`;}
function combatPanel(){const c=game.pendingCombat,a=game.players.find(p=>p.id===c.attackerId),t=game.players.find(p=>p.id===c.targetPlayerId);const blocks=c.blocks||[];const candidates=t.battlefield.filter(x=>MC.isCreature(x)&&!x.tapped);const editable=canControl(a.id)||canControl(t.id);return `<div class="panel combat-panel" style="border-color:var(--gold)"><h3>${esc(a.name)} ataca a ${esc(t.name)}</h3><p class="small">${t.bot?'El bot ya eligió sus bloqueos; puedes cambiarlos si la mesa lo acuerda.':c.blocksDeclared?esc(t.name)+' declaró sus bloqueos.':'Elige quién bloquea a cada atacante. Se aplican el daño a criaturas, dañar primero, arrollar, toque mortal y vínculo vital.'}</p><div class="block-list">${c.attackers.map(id=>{const card=a.battlefield.find(x=>x.iid===id);if(!card)return '';const chosen=blocks.find(b=>b.attackerId===id)?.blockerId||'';const able=candidates.filter(b=>MC.canBlock(card,b));return `<div class="block-row">${imgURL(card,true)?`<img src="${esc(imgURL(card,true))}" alt="" loading="lazy">`:''}<div><strong>${esc(cardName(card))}</strong><small>${MC.power(card,a)}/${MC.toughness(card)}${(card.keywords||[]).length?' · '+esc(card.keywords.join(', ')):''}</small><select class="block-select" data-attacker="${esc(id)}" ${editable?'':'disabled'} aria-label="Bloqueador para ${esc(card.name)}"><option value="">Sin bloquear</option>${able.map(b=>`<option value="${esc(b.iid)}" ${b.iid===chosen?'selected':''}>${esc(cardName(b))} · ${MC.power(b,t)}/${MC.toughness(b)}</option>`).join('')}</select></div></div>`;}).join('')}</div><p class="small">Amenaza (dos bloqueadores) y bloqueos múltiples: marca uno aquí y ajusta el resto a mano.</p><div class="row modal-actions">${canControl(t.id)&&!t.bot?button('Declarar mis bloqueos','declare-blocks','','ghost'):''}${canControl(a.id)?button('Aplicar daño de combate','combat-resolve','','primary'):'<span class="small">El atacante aplica el daño.</span>'}${canControl(a.id)?button('Solo daño al jugador (manual)','combat-resolve-legacy','','ghost'):''}</div></div>`;}
function act(type,payload={},who=actor){if(!game)return;const a={id:MD.uid(),type,actorId:who,payload,expectedRevision:game.revision};try{if(!canControl(who))throw Error('Solo puedes controlar tu asiento.');if(online)MN.action(a);else{const r=MC.dispatch(game,a);if(!r.ok)throw Error(r.error);game=r.state;db.saved=game;save();render();}return true;}catch(e){toast(e.message);return false;}}
function cardDetail(c,zone,owner){selectedCard=c;selectedZone=zone;selectedOwner=owner;const controllable=game&&owner&&canControl(owner),publicImage=imgURL(c);modal(cardName(c),`<div class="card-detail">${publicImage?`<img src="${esc(publicImage)}" alt="${esc(cardName(c))}">`:'<div class="empty" style="font-size:65px;color:var(--gold)">✦</div>'}<div><span class="badge">${esc(c.mana_cost||'Sin coste')}</span><p class="small" style="margin-top:14px">${esc(c.type_line)}</p><small>${c.artist?'Arte: '+esc(c.artist):'Imágenes de Scryfall'}</small><div class="oracle">${esc(c.printed_text||c.oracle_text||c.summary||'Sin texto disponible.')}</div>${c.localReference?'<p class="small warning">Resumen local para practicar. Consulta Scryfall para el texto oficial actualizado.</p>':''}<div class="row" style="margin-top:15px">${c.card_faces?.length>1?button('Ver otra cara','flip-art'):''}${button('Texto en español','translate-card')}${button('Fallos / rulings','rulings')}${button('Consultar en Claude ↗','claude-card')}</div></div></div>${controllable?`<div class="spacer"></div><div class="row modal-actions card-actions">${['hand','command'].includes(zone)?button(/Land/.test(c.type_line)?'Jugar tierra':'Lanzar · pago manual','cast-card',`data-owner="${esc(owner)}"`,'primary'):''}${['hand','command'].includes(zone)&&!/Land/.test(c.type_line)?button('Revisar pago automático','auto-cast',`data-owner="${esc(owner)}"`)+button('Lanzar · pagar reserva','cast-paid',`data-owner="${esc(owner)}"`):''}${zone==='battlefield'?tapButtons(c,owner):''}</div><label>Mover manualmente a</label><div class="searchrow"><select id="move-to">${[['hand','Mano'],['battlefield','Campo'],['graveyard','Cementerio'],['exile','Exilio'],['command','Zona de mando'],['library','Biblioteca · arriba'],['bottom','Biblioteca · fondo']].filter(x=>x[0]!==zone).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>${button('Mover','move-card',`data-owner="${esc(owner)}"`)}</div>${zone==='battlefield'?`<div class="row" style="margin-top:12px">${button('＋ contador +1/+1','card-counter',`data-owner="${esc(owner)}"`)}<small>${esc(JSON.stringify(c.counters||{}))}</small></div>`:''}`:''}`);}
function tapButtons(c,owner){const o=`data-owner="${esc(owner)}"`;if(c.tapped)return button('Enderezar','tap-card',o);const src=MC.manaSource(c,game.players.find(p=>p.id===owner));if(!src)return button('Girar','tap-card',o);const sym=x=>'{'+x+'}'.repeat(src.amount);return src.options.map(x=>button('Girar · +'+sym(x),'tap-card',o+` data-color="${x}"`,src.options.length>1?'mana-choice':'')).join('')+button('Girar sin maná','tap-card',o+' data-manual="true"','ghost');}

function tournaments(){return `<div class="section-head" style="margin-top:0"><div><span class="eyebrow">EL RETO ENTRE AMIGOS</span><h2 style="margin-top:8px">Ligas de la mesa</h2></div>${button('＋ Crear liga','new-league','','primary')}</div><p>Ligas casuales locales: registra una victoria por mesa. Cada victoria vale un punto; los empates en la clasificación comparten puesto.</p>${db.tournaments.map((t,i)=>`<section class="panel" style="margin-bottom:16px"><div class="row between"><h3>${esc(t.name)}</h3><small>${t.matches.length} resultados</small></div><div class="table-wrap"><table><thead><tr><th>Jugador</th><th>Victorias / puntos</th></tr></thead><tbody>${t.players.map(n=>({n,w:t.matches.filter(x=>x===n).length})).sort((a,b)=>b.w-a.w).map(p=>`<tr><td>${esc(p.n)}</td><td>${p.w}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:15px">${button('Registrar ganador','league-result',`data-index="${i}"`)}${t.matches.length?button('Deshacer último resultado','league-undo',`data-index="${i}"`):''}${button('Exportar','league-export',`data-index="${i}"`)}</div></section>`).join('')||'<div class="empty">Crea una liga con los nombres de tus amigos y lleva la clasificación.</div>'}`;}
function download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function importModal(){modal('Trae tu próxima estrategia',`<div class="tabs">${button('Lista de texto','import-tab','data-tab="text"','active')}${button('Enlace Archidekt','import-tab','data-tab="url"')}${button('Archivo JSON','import-tab','data-tab="json"')}</div><div id="import-text"><p class="small">Pega una lista de Archidekt, Moxfield o Arena. Usa «Commander» antes del comandante y «Deck» antes del resto.</p><textarea id="deck-list" placeholder="Commander\n1 Marrow-Gnawer\n\nDeck\n37 Swamp\n62 Rat Colony"></textarea><label>Nombre del deck</label><input id="import-name" placeholder="Mi nueva estrategia"><div class="spacer"></div>${button('Importar lista','import-list','','primary')}</div><div id="import-url" hidden><label>Enlace público de Archidekt</label><input id="archidekt-url" type="url" placeholder="https://archidekt.com/decks/…"><p class="small">Pega el enlace de un deck público. La app consultará Archidekt desde su servidor y conservará las ediciones y el arte de sus cartas.</p>${button('Consultar e importar','import-url','','primary')}</div><div id="import-json" hidden><p class="small">Restaura un respaldo de Mesa Commander o importa un deck JSON. Los decks se agregan; una partida importada se guarda como recuperable.</p><input id="json-file" type="file" accept=".json,application/json"></div><p id="import-progress" class="small gold"></p>`);}
function settings(){modal('Tu espacio de juego',`<label>Nombre de jugador</label><input id="settings-name" value="${esc(db.name)}" maxlength="40"><div class="row" style="margin-top:15px">${button('Guardar nombre','save-settings','','primary')}${button('Exportar respaldo','export-all')}${button('Restaurar / importar','import')}</div><div class="spacer"></div><h3>Instalación y datos</h3><p class="small">La versión web incluye manifest y caché sin conexión. En Android, usa «Añadir a pantalla de inicio» o «Instalar aplicación» si tu navegador lo permite. La instalación depende del navegador y del acceso al sitio.</p>${installPrompt?button('Instalar aplicación','install','','primary'):''}<p class="small">Los decks y partidas se guardan en este navegador. No hay cuentas ni sincronización en la nube en esta entrega. Exporta el respaldo para moverlos a otro dispositivo.</p><h3>Alcance de esta versión</h3><p class="small">Commander de mesa libre, un comandante por deck. Bots que juegan, eligen objetivos y bloquean; combate con daño a criaturas; efectos automáticos para el texto que la app reconoce y manuales para el resto. Standard, Brawl, Draft, APK, IA interna y cuentas en la nube todavía no están implementados.</p><p class="small">P2P requiere el servicio de señalización PeerJS. Si se corta la red, los invitados reintentan solos y reenvían sus acciones pendientes. Si el anfitrión recarga o sale, puede reabrir la sala con el mismo código desde Inicio.</p><small>Datos e imágenes: Scryfall. Cartas y marcas pertenecen a sus titulares. App de fans no oficial.</small>`);}
function tableTips(){
 if(!game)return;
 const p=game.players.find(q=>q.id===actor),active=game.players.find(q=>q.id===game.activePlayerId),own=p.id===active.id;
 const phases=[
 'Inicio: revisa enderezar, mantenimiento y robo. Al pasar turno, la app endereza y roba para el siguiente jugador; no robes dos veces. En el primer turno, usa la biblioteca para robar cuando corresponda.',
 'Principal 1: normalmente puedes jugar una tierra en tu turno, con la pila vacía. Revisa los colores del coste antes de producir maná.',
 'Combate: selecciona atacantes y defensor. Una criatura recién llegada normalmente no puede atacar sin prisa. Acuerden bloqueos antes de confirmar daño.',
 'Principal 2: puedes jugar la tierra del turno si aún no lo hiciste y preparar permanentes después del combate.',
 'Final: revisen habilidades de fin de turno y acuerden si alguien responde antes de pasar.',
 'Limpieza: normalmente descarta hasta tu tamaño máximo de mano (siete). Revisa efectos hasta el final del turno; las excepciones se aplican a mano.'
 ];
 const available=p.battlefield.filter(c=>!c.tapped&&MC.simpleLandMana(c)).length,total=MC.COLORS.reduce((n,c)=>n+p.mana[c],0);
 const suggestions=[phases[game.phase]||'Revisen el estado de la mesa.'];
 if(!own)suggestions.push('Es el turno de '+active.name+'. Puedes guardar maná disponible para responder cuando tengas prioridad; normalmente no puedes jugar una tierra en el turno de otro jugador.');
 if(game.stack.length)suggestions.push('Hay '+game.stack.length+' hechizo(s) en la pila. El último se resuelve primero. Acuerden respuestas; no avances fase con la pila pendiente.');
 if(game.pendingCombat)suggestions.push('Hay un combate pendiente: confirma qué atacantes fueron bloqueados antes de aplicar el daño.');
 if(own&&[1,3].includes(game.phase))suggestions.push(p.landsPlayed?'Ya jugaste '+p.landsPlayed+' tierra(s) este turno. Solo juega otra si un efecto lo permite.':'Todavía no has jugado tu tierra de este turno. Busca una en tu mano.');
 suggestions.push('Tienes '+available+' tierra(s) sencilla(s) enderezada(s) y '+total+' maná en reserva. Jugar una tierra no produce maná: abre la carta y usa Girar · +1.');
 modal('Tips para tu mesa',`<span class="badge">Guía local · ${esc(MC.PHASES[game.phase])}</span><ol class="tips-list">${suggestions.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><details class="tips-more"><summary>Maná, comandante y acciones manuales</summary><p>Una tierra sencilla añade un maná de su tipo al girarse. Enderezarla no añade ni devuelve maná. Usa Girar sin maná si la gira otro efecto, y Ajustar para corregir la reserva.</p><p>La app vacía la reserva al avanzar fase o turno. En las reglas, el maná no gastado también se pierde al terminar cada paso: ajusta la reserva al resolver pasos dentro de estas fases simplificadas.</p><p>Para descontar el coste automáticamente, elige Lanzar · pagar reserva. El pago manual no descuenta la reserva. El impuesto de comandante añade dos manás genéricos por cada lanzamiento anterior desde la zona de mando.</p><p>Las tierras duales y los artefactos de maná sencillos te dejan elegir el color al girarlos. Las tierras con dolor, costes adicionales o efectos que cambien el maná se resuelven a mano.</p></details><div class="row"><a href="https://magic.wizards.com/en/how-to-play" target="_blank" rel="noopener noreferrer">Guía oficial de Magic ↗</a>${button('Tutorial paso a paso','tutorial')}</div>`);
}
function tutorial(step=0){const steps=[['Elige tu comandante','Abre Mis decks. Cada lista incluye al comandante dentro de sus 100 cartas. La identidad de color limita qué cartas puedes usar.'],['Prepara tu mesa','Crea una mesa local o una sala online. Tus amigos usan el código de ocho caracteres. Acuerden el nivel de poder antes de empezar.'],['Roba tu mano','Empiezas con siete cartas y 40 vidas. Si necesitas mulligan, baraja y roba siete; devuelve al fondo las cartas que correspondan.'],['Comienza el turno','Endereza tus permanentes y resuelve mantenimiento y robo. Al pasar turno, esta app endereza y roba automáticamente para el siguiente jugador. En el primer turno, usa Robar.'],['Juega una tierra','Abre una tierra de tu mano y pulsa Jugar tierra. El asistente limita a una por turno; usa Mover si un efecto permite más.'],['Produce maná','Abre una tierra básica o sencilla y pulsa Girar · +1: su maná se añade automáticamente. Para girarla por otro efecto usa Girar sin maná. Las tierras con elecciones o condiciones se resuelven manualmente.'],['Lanza un hechizo','Abre una carta y elige pago manual o pagar con la reserva. Va a la pila. El comandante tiene un coste adicional por cada lanzamiento anterior desde la zona de mando.'],['Resuelve la pila','Acuerden prioridad por chat. El jugador activo resuelve la carta superior. Si la app entiende la carta (marca «Asistido»), te pide los objetivos y aplica el efecto; si no, aplícalo a mano.'],['Entra en combate','Selecciona atacantes y un defensor. El defensor elige un bloqueador por atacante (los bots lo hacen solos). Al aplicar el daño la app resuelve criaturas, dañar primero, arrollar, toque mortal y vínculo vital.'],['Guarda tu historia','La mesa local se guarda tras cada acción. Finaliza para registrar un resultado. Exporta un respaldo si vas a cambiar de dispositivo.']];const [title,body]=steps[step];modal(`Paso ${step+1} de 10 · ${title}`,`<p>${body}</p><div class="row between">${step?button('← Anterior','tutorial-step',`data-step="${step-1}"`):'<span></span>'}${step<9?button('Siguiente →','tutorial-step',`data-step="${step+1}"`,'primary'):button('Ir a la mesa','tutorial-end','','primary')}</div>`);}
async function handle(el){const a=el.dataset.action,d=el.dataset;switch(a){
case 'nav':editing=null;go(d.route);break;
case 'close':close();break;
case 'settings':settings();break;
case 'save-settings':db.name=$('#settings-name').value.trim()||'Planeswalker';db.nameConfirmed=true;save();close();render();break;
case 'first-name-save':{const v=$('#first-name').value.trim();if(!v)throw Error('Escribe tu nombre.');db.name=v.slice(0,40);db.nameConfirmed=true;save();close();render();break;}
case 'newgame':newGameModal();break;
case 'practice':newGameModal('starter-rats');break;
case 'deck-play':newGameModal(d.id);break;
case 'join':joinModal();break;
case 'start-setup':{if(online||game){toast('Guarda y sal de la mesa actual antes de crear otra.');break;}const deck=deckBy($('#game-deck').value);if(!deck?.commander||!deck.cards.length)throw Error('Tu deck necesita un comandante y cartas.');const name=$('#player-name').value.trim()||'Planeswalker',n=+$('#player-count').value,type=$('#game-type').value;db.name=name;const players=Array.from({length:n},(_,i)=>({id:'p'+(i+1),name:i===0?name:type==='hotseat'?'Jugador '+(i+1):'Bot '+i,bot:i>0&&type!=='hotseat',deck:i===0?deck:MD.defaultDecks()[0]}));close();actor='p1';chats=[];if(type==='online'){online=true;lobby=players;go('mesa');try{await MN.create({players},networkCallbacks());}catch(e){online=false;lobby=null;render();throw e;}}else{online=false;game=MC.createGame({players});db.saved=game;save();go('mesa');}break;}
case 'join-room':{if(game||online)throw Error('Sal de la mesa actual antes de unirte.');const code=$('#room-code').value,name=$('#join-name').value.trim()||'Invitado',deck=deckBy($('#join-deck').value);if(!deck?.commander)throw Error('Selecciona un deck con comandante.');close();online=true;lobby=[];go('mesa');try{await MN.join(code,{name,deck},networkCallbacks());}catch(e){online=false;render();throw e;}break;}
case 'start-online':MN.start();break;
case 'rejoin':MN.rejoin();toast('Reconectando…');render();break;
case 'reopen-room':{if(game||online)throw Error('Sal de la mesa actual antes de reabrir la sala.');online=true;actor='p1';chats=[];go('mesa');try{await MN.resumeHost(networkCallbacks());toast('Sala '+MN.room+' reabierta. Tus amigos se reconectan solos.');}catch(e){online=false;render();throw e;}break;}
case 'forget-room':MN.forget();render();break;
case 'guest-return':joinModal(MN.savedGuest()?.room||'');break;
case 'leave-online':MN.reset();online=false;lobby=null;game=null;go('inicio');break;
case 'copy-room':await copy(MN.room);break;
case 'resume':if(game||online)throw Error('Sal de tu mesa actual antes de recuperar otra.');game=MD.clone(db.saved);game.mode='free';online=false;actor='p1';go('mesa');toast('Guardado recuperado como mesa local.');break;
case 'pause':modal('Guardar y salir',`<p>${online&&!MN.isHost?'Tu asiento puede reconectar desde este navegador mientras el anfitrión siga conectado.':'El estado actual queda guardado en este dispositivo para continuar como mesa local.'}</p>${online&&MN.isHost?'<p class="warning">Tus invitados quedarán esperando. Desde Inicio podrás reabrir la sala con el mismo código y volverán a su asiento solos.</p>':''}${button('Guardar y volver al inicio','confirm-pause','','primary')}`);break;
case 'confirm-pause':if(!online||MN.isHost){db.saved=game;save();}MN.reset();online=false;game=null;lobby=null;close();go('inicio');break;
case 'endgame':if(online&&!MN.isHost)throw Error('El anfitrión registra el resultado.');modal('Registra esta partida',`<label>Ganador</label><select id="winner"><option value="">Sin ganador / cancelada</option>${game.players.map(p=>`<option value="${esc(p.id)}" ${game.winnerId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><p class="small">Se guardará el resultado en tu historial local y se cerrará la mesa.</p>${button('Guardar resultado y finalizar','confirm-end','','primary')}`);break;
case 'confirm-end':MN.forget();db.history.push({id:game.id,date:new Date().toISOString(),players:game.players.map(p=>({id:p.id,name:p.name})),winnerId:$('#winner').value,turn:game.turn});db.saved=null;save();MN.reset();game=null;online=false;lobby=null;close();go('historial');break;
case 'life':act('LIFE',{delta:+d.delta},d.player);break;
case 'draw':act('DRAW',{count:1});break;
case 'mulligan':if(act('MULLIGAN'))toast('Revisa el registro y devuelve al fondo las cartas que correspondan.');break;
case 'shuffle':act('SHUFFLE');break;
case 'phase':act('NEXT_PHASE',{},game.activePlayerId);break;
case 'turn':act('NEXT_TURN',{},game.activePlayerId);break;
case 'resolve':{const entry=game.stack.at(-1);const plan=entry?MC.effectPlan(game,entry):null;if(plan?.targeted.length){modal('Elige objetivos · '+cardName(entry.card),`<p class="small">La app aplicará: ${plan.steps.map(x=>esc(x.label)).join(' · ')}.</p>${plan.targeted.map((t,i)=>`<label>${esc(t.label)}</label>${t.options.length?`<select class="effect-target" data-index="${i}">${t.options.map((o,j)=>`<option value="${j}">${esc(o.label)}</option>`).join('')}</select>`:'<p class="warning small">No hay objetivos legales: resuelve a mano.</p>'}`).join('')}<div class="spacer"></div><div class="row modal-actions">${plan.targeted.every(t=>t.options.length)?button('Resolver con estos objetivos','resolve-target','','primary'):''}${button('Resolver y aplicar a mano','resolve-manual','','ghost')}</div>`);}else act('RESOLVE',{},game.activePlayerId);break;}
case 'resolve-target':{const entry=game.stack.at(-1),plan=MC.effectPlan(game,entry);const targets=[...document.querySelectorAll('.effect-target')].map(el=>plan.targeted[+el.dataset.index].options[+el.value].target);close();act('RESOLVE',{targets},game.activePlayerId);break;}
case 'resolve-manual':close();act('RESOLVE',{manual:true},game.activePlayerId);break;
case 'mana':act('MANA',{color:d.color,delta:1});break;
case 'table-tips':tableTips();break;
case 'jump':document.querySelector(d.target)?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'auto-cast':autoPayModal(selectedCard,selectedZone,d.owner);break;
case 'auto-cast-confirm':{const plan=pendingAutoPay;if(!plan)throw Error('Vuelve a revisar el pago.');pendingAutoPay=null;close();act('CAST',{iid:plan.iid,from:plan.from,autoPay:true,autoPayRevision:plan.revision,landIds:plan.landIds},plan.owner);break;}
case 'auto-cast-back':{const plan=pendingAutoPay,c=game.players.find(p=>p.id===plan?.owner)?.[plan?.from]?.find(c=>c.iid===plan.iid);if(!c)throw Error('La carta cambió de zona.');cardDetail(c,plan.from,plan.owner);break;}
case 'response-mode':act('SET_RESPONSE_CHECKS',{enabled:d.enabled==='true'},game.activePlayerId);break;
case 'response-pass':act('PASSED_RESPONSE',{pass:d.pass==='true'},d.player);break;
case 'stack-card':{const spell=game.stack.find(e=>e.id===d.id);if(spell)cardDetail(spell.card,'stack',null);break;}
case 'hand-fold':db.tablePrefs={...tablePrefs(),handFolded:!tablePrefs().handFolded};save();render();break;
case 'table-summary':tableSummary();break;
case 'table-view-settings':modal('Vista de la mesa',`<p>Elige el tamaño de las cartas de tu campo y mano. Esta preferencia solo cambia tu pantalla.</p><div class="row">${[['small','Compactas'],['normal','Normales'],['large','Grandes']].map(([size,label])=>button(label,'card-size',`data-size="${size}" aria-pressed="${tablePrefs().size===size}"`,tablePrefs().size===size?'primary':'')).join('')}</div>`);break;
case 'card-size':if(['small','normal','large'].includes(d.size)){db.tablePrefs={...tablePrefs(),size:d.size};save();close();render();}break;
case 'attack-select':document.querySelectorAll('.attack-check:not(:disabled)').forEach(el=>el.checked=d.checked==='true');break;
case 'mana-adjust':modal('Ajustar reserva de maná',`<p>Usa un número negativo para quitar maná o positivo para añadirlo.</p><label>Tipo de maná</label><select id="mana-kind">${[['W','Blanco'],['U','Azul'],['B','Negro'],['R','Rojo'],['G','Verde'],['C','Incoloro']].map(([c,n])=>`<option value="${c}">${n} {${c}}</option>`).join('')}</select><label>Cantidad a añadir o quitar</label><input id="mana-delta" type="number" step="1" value="-1"><div class="spacer"></div>${button('Aplicar ajuste','mana-apply','','primary')}`);break;
case 'mana-apply':{const color=$('#mana-kind').value,delta=Number($('#mana-delta').value);if(!Number.isInteger(delta))throw Error('Usa una cantidad entera de maná.');close();act('MANA',{color,delta});break;}
case 'botturn':{if(!canControl(game.activePlayerId))throw Error('Solo el anfitrión ejecuta los bots.');const r=MC.botTurn(game,game.activePlayerId);if(r.error)throw Error(r.error);game=r.state;if(online)MN.sync(game);else{db.saved=game;save();render();}break;}
case 'game-card':{const p=game.players.find(p=>p.id===d.player),c=p[d.zone][+d.index];cardDetail(c,d.zone,d.player);break;}
case 'cast-card':case 'cast-paid':{const c=selectedCard,z=selectedZone;close();act('CAST',{iid:c.iid,from:z,payMana:a==='cast-paid'},d.owner);break;}
case 'tap-card':{const id=selectedCard.iid,tapped=!selectedCard.tapped;close();act('TAP',{iid:id,tapped,produceMana:d.manual!=='true',...(d.color?{color:d.color}:{})},d.owner);break;}
case 'move-card':{const c=selectedCard,z=selectedZone,to=$('#move-to').value;close();act('MOVE',{iid:c.iid,from:z,to:to==='bottom'?'library':to,position:to==='bottom'?'bottom':'top'},d.owner);break;}
case 'card-counter':{const id=selectedCard.iid;close();act('COUNTER',{iid:id,name:'+1/+1',delta:1},d.owner);break;}
case 'player-info':{const p=game.players.find(p=>p.id===d.player);modal(p.name,`<p>Vidas: ${p.life} · Veneno: ${p.poison} · Lanzamientos del comandante: ${p.commanderCasts}</p>${canControl(p.id)?`<div class="row">${button('− veneno','poison',`data-player="${esc(p.id)}" data-delta="-1"`)}${button('＋ veneno','poison',`data-player="${esc(p.id)}" data-delta="1"`)}</div><label>Daño recibido del comandante de</label><select id="damage-source">${game.players.filter(q=>q.id!==p.id).map(q=>`<option value="${esc(q.id)}">${esc(q.name)} · ${p.commanderDamage[q.id]||0}</option>`).join('')}</select><label>Ajuste de daño (usa negativo para corregir)</label><input id="damage-value" type="number" value="1"><div class="spacer"></div>${button('Registrar daño de comandante','commander-damage',`data-player="${esc(p.id)}"`)}<p class="small">Este contador no cambia vidas. Ajusta las vidas por separado.</p>`:''}`);break;}
case 'poison':close();act('POISON',{delta:+d.delta},d.player);break;
case 'commander-damage':{const sourcePlayerId=$('#damage-source').value,delta=Number($('#damage-value').value);close();act('COMMANDER_DAMAGE',{sourcePlayerId,delta},d.player);break;}
case 'token':modal('Crea una ficha',`<label>Nombre</label><input id="token-name" value="Ficha de criatura"><div class="grid2"><div><label>Fuerza</label><input id="token-power" type="number" value="1"></div><div><label>Resistencia</label><input id="token-toughness" type="number" value="1"></div></div><div class="spacer"></div>${button('Crear ficha','create-token','','primary')}`);break;
case 'create-token':{const name=$('#token-name').value,power=Number($('#token-power').value),toughness=Number($('#token-toughness').value);close();act('TOKEN',{name,power,toughness});break;}
case 'zone':{const p=game.players.find(p=>p.id===actor);modal(d.zone==='graveyard'?'Cementerio':'Exilio',`<div class="card-strip">${p[d.zone].map((c,i)=>playcard(c,d.zone,i,p.id)).join('')||'<p>No hay cartas aquí.</p>'}</div>`);break;}
case 'library':if(online)MN.peek();else{privateLibrary=game.players.find(p=>p.id===actor).library;libraryModal();}break;
case 'library-card':cardDetail(privateLibrary[+d.index],'library',actor);break;
case 'attack':{const p=game.players.find(p=>p.id===actor);modal('Declara tus atacantes',`<label>Defensor</label><select id="attack-target">${game.players.filter(q=>q.id!==actor&&!q.eliminated).map(q=>`<option value="${esc(q.id)}">${esc(q.name)}</option>`).join('')}</select><div class="spacer"></div><div class="row">${button('Seleccionar disponibles','attack-select','data-checked="true"')}${button('Quitar selección','attack-select','data-checked="false"','ghost')}</div><div class="combat-picker">${p.battlefield.filter(c=>/Creature/.test(c.type_line)).map(c=>`<label class="combat-choice">${imgURL(c)?`<img src="${esc(imgURL(c))}" alt="" loading="lazy">`:''}<input class="attack-check" type="checkbox" value="${esc(c.iid)}" ${c.tapped||c.sick&&!c.keywords?.includes('Haste')?'disabled':''}>${esc(c.name)} ${c.sick?'· recién llegada':''} ${c.tapped?'· girada':''}</label>`).join('')||'<p>No tienes criaturas en el campo.</p>'}</div><div class="spacer"></div>${button('Declarar ataque','declare-attack','','primary')}`);break;}
case 'declare-attack':{const attackers=[...document.querySelectorAll('.attack-check:checked')].map(x=>x.value),targetPlayerId=$('#attack-target').value;close();act('COMBAT',{attackers,targetPlayerId});break;}
case 'combat-resolve':act('RESOLVE_COMBAT',{blocks:readBlocks(),confirm:true},game.activePlayerId);break;
case 'combat-resolve-legacy':act('RESOLVE_COMBAT',{blockedIds:readBlocks().map(b=>b.attackerId),confirm:true},game.activePlayerId);break;
case 'declare-blocks':act('DECLARE_BLOCKS',{blocks:readBlocks()},game.pendingCombat.targetPlayerId);break;
case 'chat':MN.chat($('#chat-text').value);break;
case 'emote':MN.chat(d.text);break;
case 'newdeck':{const id=MD.uid();db.decks.push({id,name:'Mi nueva estrategia',commander:null,cards:[],format:'commander'});save();editing=id;results=[];go('decks');break;}
case 'edit':editing=d.id;results=[];go('decks');break;
case 'backdecks':editing=null;render();break;
case 'rename':deckBy(editing).name=$('#deck-name').value.trim()||'Mi deck';save();render();toast('Deck guardado.');break;
case 'search':{const q=$('#card-query').value,lang=$('#card-lang').value;if(!q.trim())throw Error('Escribe una carta.');$('#search-results').innerHTML='<p class="loading">Buscando en el multiverso…</p>';try{results=await MD.searchCards(q,lang);}catch(e){results=[...new Map(db.decks.flatMap(d=>[d.commander,...d.cards]).filter(Boolean).filter(c=>(c.name+' '+(c.printed_name||'')).toLowerCase().includes(q.toLowerCase())).map(c=>[c.name,c])).values()];toast(results.length?'Mostrando coincidencias guardadas. La búsqueda remota no respondió.':e.message);}if($('#search-results'))$('#search-results').innerHTML=resultsHTML()||'<p class="muted">Sin coincidencias. Prueba un nombre en inglés o cambia el idioma.</p>';break;}
case 'add-card':if(deckBy(editing).cards.length>=249)throw Error('Límite de 250 cartas por deck.');deckBy(editing).cards.push(MD.clone(results[+d.index]));save();render();break;
case 'set-commander':deckBy(editing).commander=MD.clone(results[+d.index]);save();render();break;
case 'remove-card':deckBy(editing).cards.splice(+d.index,1);save();render();break;
case 'deck-detail':cardDetail(deckBy(editing).cards[+d.index]);break;
case 'result-detail':cardDetail(results[+d.index]);break;
case 'validate':{const v=MC.validateDeck(deckBy(editing));modal('Revisión de Commander',`<span class="badge">${v.valid?'Comprobaciones básicas correctas':'Requiere ajustes'}</span><ul class="checklist">${v.errors.map(e=>`<li class="warning">${esc(e)}</li>`).join('')}</ul><ul class="checklist">${v.warnings.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`);break;}
case 'delete-deck':modal('Eliminar deck',`<p>Se eliminará ${esc(deckBy(editing).name)} de este navegador. Tus partidas guardadas conservan sus cartas.</p>${button('Eliminar este deck','confirm-delete','','danger')}`);break;
case 'confirm-delete':db.decks=db.decks.filter(x=>x.id!==editing);editing=null;save();close();render();break;
case 'export-deck':{const deck=deckBy(editing);download('mesa-deck.txt',(deck.commander?'Commander\n1 '+deck.commander.name+'\n\n':'')+'Deck\n'+grouped(deck.cards).map(x=>x.n+' '+x.c.name).join('\n'),'text/plain');break;}
case 'import':importModal();break;
case 'import-tab':['text','url','json'].forEach(t=>$('#import-'+t).hidden=t!==d.tab);break;
case 'import-list':{const text=$('#deck-list').value,name=$('#import-name').value;el.disabled=true;try{const deck=await MD.resolveList(text,msg=>{if($('#import-progress'))$('#import-progress').textContent=msg;});deck.name=name.trim()||deck.name;db.decks.push(deck);save();editing=deck.id;close();go('decks');toast('Lista importada. Revisa el comandante y la validación.');}finally{el.disabled=false;}break;}
case 'import-url':{el.disabled=true;$('#import-progress').textContent='Cargando el deck y el arte de sus cartas…';try{const deck=await MD.archidekt($('#archidekt-url').value);db.decks.push(deck);save();editing=deck.id;close();go('decks');}catch(error){if($('#import-progress'))$('#import-progress').textContent=error.message;throw error;}finally{el.disabled=false;}break;}
case 'refresh-deck':{const old=deckBy(editing);el.disabled=true;try{const next=await MD.archidekt(old.source);next.id=old.id;db.decks[db.decks.indexOf(old)]=next;save();render();toast('Deck actualizado desde Archidekt.');}finally{el.disabled=false;}break;}
case 'export-all':download('mesa-commander-respaldo.json',db);toast('Respaldo exportado. Incluye información privada de la partida guardada.');break;
case 'flip-art':{const card=selectedCard;const img=$('#modal-body .card-detail img');if(img&&card.card_faces?.length>1){const face=img.dataset.face==='back'?'front':'back';const url=card.card_faces[face==='back'?1:0]?.image_uris?.normal;if(!url)throw Error('No hay imagen de la otra cara disponible.');img.src=url;img.dataset.face=face;}break;}
case 'translate-card':{const c=selectedCard;el.disabled=true;try{const data=await MD.request('https://api.scryfall.com/cards/search?q='+encodeURIComponent((c.oracle_id?'oracleid:'+c.oracle_id:'!"'+c.name.replaceAll('"','')+'"')+' lang:es')+'&unique=prints');const translated=MD.slim(data.data[0]);cardDetail({...c,...translated},selectedZone,selectedOwner);}catch{throw Error('No se encontró impresión en español o la consulta fue bloqueada. Puedes consultar la carta en Claude.');}finally{el.disabled=false;}break;}
case 'rulings':{if(!/^https:\/\/api\.scryfall\.com\/cards\/[a-f0-9-]+\/rulings$/.test(selectedCard.rulings_uri||''))throw Error('Actualiza esta carta desde Scryfall para consultar sus fallos oficiales.');const c=selectedCard;const r=await MD.request(c.rulings_uri);modal('Fallos · '+c.name,r.data.map(x=>`<p class="small"><strong>${esc(x.published_at)}</strong><br>${esc(x.comment)}</p>`).join('')||'<p>No hay fallos publicados para esta carta.</p>');break;}
case 'claude-card':{const c=selectedCard;const question='Explica en español esta carta de Magic: The Gathering para Commander. Distingue texto de carta y explicación; cita reglas si puedes y señala dudas. Carta: '+c.name+'\n'+(c.oracle_text||c.summary||'');modal('Consulta preparada para Claude',`<p class="small">Copia la pregunta y pégala en Claude. La app no envía tu mano ni tu partida a una API de IA.</p><textarea id="claude-prompt">${esc(question)}</textarea><div class="row">${button('Copiar pregunta','copy-prompt')}<a href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Abrir Claude ↗</a></div>`);break;}
case 'copy-prompt':await copy($('#claude-prompt').value);break;
case 'tutorial':tutorial();break;
case 'tutorial-step':tutorial(+d.step);break;
case 'tutorial-end':close();go('mesa');break;
case 'new-league':modal('Una liga entre amigos',`<label>Nombre de la liga</label><input id="league-name" placeholder="Los viernes de Commander"><label>Jugadores, uno por línea</label><textarea id="league-players" placeholder="Juan\nIván\n…"></textarea><div class="spacer"></div>${button('Crear liga','create-league','','primary')}`);break;
case 'create-league':{const players=[...new Set($('#league-players').value.split('\n').map(x=>x.trim().slice(0,40)).filter(Boolean))];if(players.length<2||players.length>32)throw Error('Incluye entre 2 y 32 jugadores diferentes.');db.tournaments.push({id:MD.uid(),name:$('#league-name').value.trim().slice(0,70)||'Mi liga',players,matches:[]});save();close();render();break;}
case 'league-result':modal('Registra el ganador',`<label>Ganador de la mesa</label><select id="league-winner">${db.tournaments[+d.index].players.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div class="spacer"></div>${button('Guardar victoria','save-league-result',`data-index="${d.index}"`,'primary')}`);break;
case 'save-league-result':db.tournaments[+d.index].matches.push($('#league-winner').value);save();close();render();break;
case 'league-undo':db.tournaments[+d.index].matches.pop();save();render();break;
case 'league-export':download('mesa-liga.json',db.tournaments[+d.index]);break;
case 'install':if(installPrompt){await installPrompt.prompt();installPrompt=null;}break;
}}
function readBlocks(){return [...document.querySelectorAll('.block-select')].filter(el=>el.value).map(el=>({attackerId:el.dataset.attacker,blockerId:el.value}));}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado.');}catch{modal('Copia este texto',`<textarea readonly>${esc(text)}</textarea>`);}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)Promise.resolve(handle(el)).catch(err=>toast(err.message||'No se pudo completar la acción.'));});
document.addEventListener('change',async e=>{if(e.target.id==='actor-select'){actor=e.target.value;render();}if(e.target.id==='json-file'){try{const file=e.target.files[0];if(!file)return;if(file.size>15000000)throw Error('El respaldo supera 15 MB.');const value=JSON.parse(await file.text());const decks=value.version===1?value.decks:[value];if(!Array.isArray(decks)||decks.length>100)throw Error('Formato de respaldo no válido.');for(const d of decks){if(!d||!Array.isArray(d.cards)||d.cards.length>250||typeof d.name!=='string'||d.cards.some(c=>!c||typeof c.name!=='string'))throw Error('El archivo contiene decks no válidos.');}const imported=decks.map(d=>({...d,id:MD.uid()}));let hist=[],leagues=[],saved=null;
if(value.version===1){
 if(!Array.isArray(value.history)||value.history.length>10000||!Array.isArray(value.tournaments)||value.tournaments.length>100)throw Error('Historial o ligas no válidos.');
 hist=value.history.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.players)&&x.players.every(p=>p&&typeof p.name==='string')&&Number.isFinite(x.turn)&&typeof x.date==='string');
 leagues=value.tournaments.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.players)&&x.players.every(n=>typeof n==='string')&&Array.isArray(x.matches)&&x.matches.every(n=>x.players.includes(n)));
 if(value.saved){const g=value.saved;if(!g||!Array.isArray(g.players)||g.players.length<1||g.players.length>8||!Array.isArray(g.log)||!Array.isArray(g.stack)||!Array.isArray(g.appliedActionIds)||!Number.isInteger(g.revision)||!Number.isFinite(g.seed)||!Number.isInteger(g.turn)||!Number.isInteger(g.phase)||g.players.some(p=>!p||typeof p.id!=='string'||typeof p.name!=='string'||!Number.isFinite(p.life)||!Number.isFinite(p.poison)||!p.commanderDamage||!p.mana||MC.COLORS.some(c=>!Number.isFinite(p.mana[c]))||MC.ZONES.some(z=>!Array.isArray(p[z])||p[z].length>500||p[z].some(c=>!c||typeof c.iid!=='string'||typeof c.name!=='string')))||!g.players.some(p=>p.id===g.activePlayerId))throw Error('La partida guardada no tiene una estructura válida.');saved=g;}
}
db.decks.push(...imported);for(const x of hist)if(!db.history.some(y=>y.id===x.id))db.history.push(x);for(const x of leagues)if(!db.tournaments.some(y=>y.id===x.id))db.tournaments.push(x);if(saved&&!game&&!online)db.saved=saved;save();close();editing=null;go('decks');toast(imported.length+' decks importados'+(saved?' y partida recuperable.':'.'));
}catch(err){toast(err.message);}}});
document.addEventListener('input',e=>{if(e.target.id==='glossary-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('.glossary-item').forEach(x=>x.hidden=!x.dataset.search.includes(q));}if(e.target.id==='library-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('.library-row').forEach(x=>x.hidden=!x.dataset.name.includes(q));}});
document.addEventListener('error',e=>{if(e.target.tagName!=='IMG')return;const img=e.target;img.hidden=true;const fallback=document.createElement('span');fallback.className='art-unavailable';fallback.textContent=img.alt||'Arte no disponible';img.after(fallback);},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='card-query'){e.preventDefault();document.querySelector('[data-action="search"]').click();}if(e.key==='Enter'&&e.target.id==='chat-text'){e.preventDefault();MN.chat(e.target.value);}});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1).split('?')[0];render();});window.addEventListener('online',render);window.addEventListener('offline',render);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
save();render();
// Cada dispositivo elige su nombre la primera vez (antes todos empezaban como «Juan»).
if(!db.nameConfirmed)nameModal();
})();
</script></body></html>
