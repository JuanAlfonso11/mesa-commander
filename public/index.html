// Objetivos legales de un paso, para la interfaz y los bots.
function legalTargets(s,controllerId,step,excludeSpellId,srcIid){
 const kind=FX.targetKind(step),out=[];if(!kind)return out;const alive=s.players.filter(q=>!q.eliminated);
 if(['any','player','opponent'].includes(kind))for(const q of alive)if(kind!=='opponent'||q.id!==controllerId)out.push({target:{playerId:q.id},label:q.name+' (jugador · '+q.life+' vidas)'});
 if(['any','creature','permanent'].includes(kind)){const spec=kind==='permanent'?FX.permanentSpec(step):FX.PERMANENT_TARGET[kind==='any'?'creature or planeswalker':'creature'];const srcCard=srcIid?(s.stack.find(e=>e.card?.iid===srcIid)?.card||allPermanents(s).find(x=>x.iid===srcIid)):null,srcColors=srcCard&&FX?FX.colorsOf(srcCard):[];
 for(const q of alive)for(const c of q.battlefield)if(FX.matchesPermanent(c,spec,q.id,controllerId,srcIid)&&!hasKw(c,'Shroud')&&!(q.id!==controllerId&&hasKw(c,'Hexproof'))&&!(srcColors.length&&ABIL(c).some(a=>a.kind==='protection'&&a.colors.some(x=>srcColors.includes(x)))))out.push({target:{playerId:q.id,iid:c.iid},label:c.name+' de '+q.name+(isCreature(c)?' · '+power(c,q)+'/'+toughness(c):'')});}
 if(kind==='spell')for(const e of s.stack)if(e.id!==excludeSpellId&&FX.matchesSpell(e,step.spell))out.push({target:{spellId:e.id},label:e.card.name+' (en la pila)'});
 // Lo propio al final: así la opción por defecto apunta a un rival.
 const own=o=>o.target.playerId===controllerId||(o.target.spellId&&s.stack.find(e=>e.id===o.target.spellId)?.controllerId===controllerId);
 return [...out.filter(o=>!own(o)),...out.filter(own)];
}
function effectPlan(s,entry){const steps=effectSteps(entry.card);if(!steps)return {supported:false,steps:[],targeted:[]};const targeted=[];steps.forEach((step,index)=>{if(FX.targetKind(step))targeted.push({index,kind:FX.targetKind(step),label:FX.describe(step),options:legalTargets(s,entry.controllerId,step,entry.id,entry.card?.iid)});});return {supported:true,steps:steps.map(x=>({...x,label:FX.describe(x)})),targeted};}
function sameTarget(a,b){return a&&b&&a.playerId===b.playerId&&a.iid===b.iid&&a.spellId===b.spellId;}
function resolveEffect(s,p,c,payload,entryId){

 if(!steps){if(isPermanent(c)&&!c.supportedEffect){const miss=FX?FX.uncovered(c):[];if(miss.length)log(s,p,'Revisa a mano en '+c.name+': '+miss[0].slice(0,160),'manual');}else if(c.oracle_text||c.supportedEffect)log(s,p,'Revisa y aplica manualmente los efectos de '+c.name+'.','manual');return;}
 let targets=Array.isArray(payload.targets)?payload.targets:null;
 const targetedSteps=steps.filter(x=>FX.targetKind(x));
 if(!targets&&payload.targetPlayerId&&targetedSteps.length)targets=[{playerId:payload.targetPlayerId}];
 if(targetedSteps.length&&(!targets||targets.length<targetedSteps.length||payload.manual===true)){if(targets&&targets.length<targetedSteps.length)throw Error('Faltan objetivos para '+c.name+'.');log(s,p,'El efecto de '+c.name+' requiere objetivo o resolución manual.','manual');return;}
 // Validación completa antes de cambiar nada.

 for(const [idx,{step,target}] of plan.entries()){if(halt)break;
  const tp=target?.playerId&&!target.iid?player(s,target.playerId):null;if(tp)lastPlayer=tp;
  const chosen=()=>{const r=findPermanent(s,target.playerId,target.iid);lastCard=r.card;return r;};
  switch(step.type){
   case 'draw':{const n=amt(step.count);for(const q of who(step.who,tp))draw(s,q,n);break;}

   case 'shuffle':{const q=lastPlayer||p;shuffle(s,q.library);log(s,q,q.name+' baraja su biblioteca.','effect');break;}
   case 'fog':s.fogTurn=s.turn;log(s,p,c.name+': se prevendrá todo el daño de combate este turno.','effect');break;

   case 'pick':picked=chosen();break;
   case 'fight':{const b=chosen(),a=picked&&player(s,picked.owner.id).battlefield.find(x=>x.iid===picked.card.iid);if(!a){log(s,p,'La criatura propia ya no está: no hay pelea.','effect');break;}const hit=(from,fo,to)=>{const n=power(from,fo);if(n<=0)return;to.damage=(to.damage||0)+n;if(hasKw(from,'Deathtouch'))to.deathtouched=true;if(hasKw(from,'Lifelink')){const g=lifeGainAmount(s,fo,n);fo.life+=g;}};hit(a,picked.owner,b.card);if(step.mutual)hit(b.card,b.owner,a);log(s,p,a.name+(step.mutual?' pelea con ':' hace '+power(a,picked.owner)+' de daño a ')+b.card.name+'.','effect');creatureDeaths(s);break;}

    creatureDeaths(s);break;}

   case 'counter':{const i=s.stack.findIndex(e=>e.id===target.spellId);if(i<0)throw Error('El hechizo objetivo ya no está en la pila.');if(!s.stack[i].ability&&(ABIL(s.stack[i].card).some(a=>a.kind==='static'&&a.type==='uncounterable')||/^~ can't be countered\.?$/im.test(FX.normalize(s.stack[i].card)))){log(s,p,s.stack[i].card.name+' no puede ser contrarrestado.','effect');break;}if(step.unless){const q=player(s,s.stack[i].controllerId);createPrompt(s,q,{kind:'payOrCounter',spellId:s.stack[i].id,mana:step.unless,text:c.name+': paga '+step.unless+' o '+s.stack[i].card.name+' se contrarresta.',options:[{iid:'pay',name:'Pagar '+step.unless},{iid:'no',name:'No pagar'}],min:1,max:1});break;}last={playerId:counterSpell(s,p,c,i,step.exile).id,power:0};break;}

async function resumeHost(on){const saved=store.get(HOST_KEY);if(!saved?.room||!Array.isArray(saved.seats))throw Error('No hay una sala guardada para reabrir.');reset();callbacks=on;host=true;room=saved.room;seats=saved.seats;game=saved.game||null;started=!!saved.started&&!!game;await loadPeer();const r=await new Promise((resolve,reject)=>openHostPeer('mesa-v1-'+room,resolve,reject));if(game)emit('state',game);return r;}
function connectToHost(){
 if(!peer||peer.destroyed){peer=new Peer(peerOpts);peer.on('error',e=>{if(!everWelcomed){error(e);return;}if(e?.type==='peer-unavailable'){scheduleRetry();return;}error(e);if(!server?.open)scheduleRetry();});peer.on('disconnected',()=>{if(!closing&&peer&&!peer.destroyed)try{peer.reconnect();}catch{}});}
 const go=()=>{const conn=peer.connect('mesa-v1-'+room,{reliable:true,serialization:'json'});server=conn;const unpack=assembler();
  conn.on('open',()=>{lastFromHost=now();safeSend(conn,{type:'hello',name:joinConfig.name,deck:joinConfig.deck,token:reconnectToken});});
  conn.on('data',raw=>{if(conn!==server)return;lastFromHost=now();const d=unpack(raw);if(!d||typeof d!=='object')return;
   if(d.type==='ping'){safeSend(conn,{type:'pong',t:d.t});return;}
   if(d.type==='welcome'){everWelcomed=true;myId=d.id;reconnectToken=d.token;saveToken(room,d.token);store.set(GUEST_KEY,{room,name:joinConfig.name,id:d.id,savedAt:now()});const wasRetry=retry.active;stopRetry();emit('welcome',d.id);emit('connected',room);if(wasRetry)emit('status','Reconectado a la sala '+room+'.');for(const a of pending.values())safeSend(conn,{type:'action',action:a});}
   if(d.type==='state'){started=true;emit('state',d.state);}
   if(d.type==='ack')pending.delete(d.id);
   if(d.type==='roster')emit('roster',d.players);
   if(d.type==='error'){if(d.id)pending.delete(d.id);emit('error',d.message);}
   if(d.type==='chat')emit('chat',d.message);if(d.type==='peek')emit('peek',d.cards);});
  conn.on('close',()=>{if(conn!==server||closing)return;if(!everWelcomed){emit('disconnected','No se pudo conectar con el anfitrión. Inténtalo de nuevo; si sigue fallando, una de las redes bloquea la conexión.');return;}emit('disconnected','Se perdió la conexión con el anfitrión. Reintentando…');scheduleRetry();});
  conn.on('error',()=>{if(conn===server&&!conn.open)scheduleRetry();});
 };
 if(peer.open)go();else peer.on('open',go);
}
function scheduleRetry(){if(closing||host||!joinConfig||!everWelcomed)return;if(retry.timer)return;if(retry.n>=MAX_RETRY){retry.active=false;emit('disconnected','No se pudo volver a la sala. Pulsa Reconectar cuando el anfitrión vuelva.');return;}retry.active=true;const wait=Math.min(20000,1500*2**retry.n);retry.n++;emit('status','Reconectando con el anfitrión (intento '+retry.n+')…');retry.timer=setTimeout(()=>{retry.timer=null;try{server?.close();}catch{}if(peer&&(peer.destroyed||peer.disconnected)){try{peer.destroy();}catch{}peer=null;}connectToHost();},wait);}
// Al volver a la app tras cambiar de pestaña o bloquear el móvil, reconecta enseguida en vez de esperar al reintento.
let watchingVisibility=false;function reconnectOnReturn(){if(watchingVisibility||typeof root.document?.addEventListener!=='function')return;watchingVisibility=true;root.document.addEventListener('visibilitychange',()=>{if(root.document.visibilityState==='visible'&&!host&&joinConfig&&everWelcomed&&!server?.open)try{rejoin();}catch{}});}
function guestWatchdog(){reconnectOnReturn();stopEvery(beat);beat=every(()=>{if(host||!server)return;if(server.open&&now()-lastFromHost>20000){try{server.close();}catch{}scheduleRetry();}},5000);}
async function join(code,config,on){reset();callbacks=on;room=String(code||'').toUpperCase().replace(/[^A-Z2-9]/g,'');if(room.length!==8)throw Error('El código tiene 8 letras o números.');joinConfig={name:config.name,deck:config.deck};await loadPeer();reconnectToken=tokenFor(room);connectToHost();guestWatchdog();timer=setTimeout(()=>{if(!server?.open&&!retry.active)emit('error','La sala no respondió. Verifica el código; algunas redes móviles bloquean WebRTC.');},18000);}
// Reintento manual (botón Reconectar).
function rejoin(){if(host||!room||!joinConfig)throw Error('No hay una sala de invitado que reconectar.');stopRetry();try{server?.close();}catch{}try{peer?.destroy();}catch{}peer=null;connectToHost();}
function start(){if(!host||started)throw Error('No puedes iniciar esta sala.');game=MC.createGame({players:seats,mode:'online'});started=true;broadcast();return game;}
function action(a){if(host){const r=MC.dispatch(game,a);if(!r.ok)throw Error(r.error);game=r.state;broadcast();}else{pending.set(a.id,a);if(pending.size>50)pending.delete(pending.keys().next().value);if(!server?.open){scheduleRetry();throw Error('Sin conexión al anfitrión. Tu acción se enviará al reconectar.');}safeSend(server,{type:'action',action:a});}}
function sync(s){if(!host)throw Error('Solo el anfitrión puede sincronizar.');game=s;broadcast();}
function chat(text){if(host){const m={name:seats[0].name,text:String(text).slice(0,400),at:now()};emit('chat',m);for(const x of links.values())safeSend(x.conn,{type:'chat',message:m});}else safeSend(server,{type:'chat',text});}
function peek(){if(host)emit('peek',game.players.find(p=>p.id==='p1').library);else safeSend(server,{type:'peek'});}
function forget(){store.del(HOST_KEY);store.del(GUEST_KEY);}
root.MN={create,join,resumeHost,rejoin,start,action,sync,chat,peek,reset,forget,savedHost:()=>store.get(HOST_KEY),savedGuest:()=>store.get(GUEST_KEY),get isHost(){return host;},get room(){return room;},get myId(){return host?'p1':myId;},get connected(){return host?!!peer?.open:!!server?.open;},get reconnecting(){return retry.active;},get pendingCount(){return pending.size;}};
})(globalThis);

&!MN.savedHost()?.room?`<div class="panel row between" style="margin-top:18px"><span><strong>Estabas en la sala ${esc(MN.savedGuest().room)}</strong><br><small>Vuelve a tu asiento desde este navegador.</small></span>${button('Volver a la sala','guest-return','','primary')}</div>`:''}${db.saved?`<div class="panel row between" style="margin-top:18px"><span><strong>Tu mesa te está esperando</strong><br><small>Guardado local · turno ${db.saved.turn} · ${db.saved.players.length} jugadores</small></span>${button('Retomar partida','resume','','primary')}</div>`:''}<div class="section-head"><h2>Tus próximos aliados</h2>${button('Ver mis decks →','nav','data-route="decks"','ghost')}</div><div class="grid3 deck-grid">${db.decks.slice(0,3).map(deckCard).join('')}${db.decks.length<3?`<button class="empty" data-action="newdeck"><span style="font-size:32px;color:var(--gold)">＋</span><h3 style="margin-top:16px">Una nueva estrategia</h3><p class="small">Elige un comandante.<br>Construye algo tuyo.</p></button>`:''}</div><div class="grid2" style="margin-top:22px"><div class="note"><strong class="gold">Mesa libre, como en papel.</strong><br>Tú decides las acciones. La app lleva la cuenta y te ayuda; los efectos complejos se resuelven a mano.</div><div class="note"><strong class="gold">Listo para practicar sin conexión.</strong><br>Incluye dos listas de laboratorio. Importa tus propios decks para jugar tu estrategia habitual.</div></div>${footer()}`;}

function resultsHTML(){return results.map((c,i)=>`<article class="result">${imgURL(c)?`<img src="${esc(imgURL(c))}" loading="lazy" alt="${esc(cardName(c))}">`:''}<div class="details"><strong>${esc(cardName(c))}</strong><small>${esc(c.mana_cost)} · ${esc(c.type_line)}</small><div class="actions">${button('＋','add-card',`data-index="${i}" aria-label="Añadir ${esc(c.name)}"`)}${button('Comandante','set-commander',`data-index="${i}"`)}${button('↗','result-detail',`data-index="${i}" aria-label="Ver detalles"`)}</div></div></article>`).join('');}
function newGameModal(preselect){modal('Reúne a tu mesa',`<p>Empieza con bots o abre una sala para tus amigos. Puedes corregir las acciones manualmente.</p><label>Tu nombre</label><input id="player-name" maxlength="40" value="${esc(db.name)}"><label>Tu deck</label><select id="game-deck">${optionDecks()}</select><div class="grid2"><div><label>Asientos</label><select id="player-count"><option value="4">4 jugadores</option><option value="3">3 jugadores</option><option value="2">2 jugadores</option><option value="1">Prueba en solitario</option></select></div><div><label>Tipo de mesa</label><select id="game-type"><option value="bots">Local con bots</option><option value="hotseat">Local por turnos en este dispositivo</option><option value="online">Sala online con código</option></select></div></div><div class="note" style="margin:18px 0">Los bots usan el mazo de ratas de práctica. Juegan tierras, criaturas y los hechizos que la app entiende, eligen objetivos, atacan con criterio y bloquean. Tú confirmas el daño. Las salas online usan PeerJS y necesitan internet.</div>${button('Preparar mesa →','start-setup','','primary')}`);if(preselect)$('#game-deck').value=preselect;}
function nameModal(){modal('¿Cómo te llamas?',`<p>Así te verán en las salas online. Puedes cambiarlo luego en Ajustes.</p><label>Tu nombre</label><input id="first-name" maxlength="40" placeholder="Tu nombre de jugador" value="${esc(db.name&&db.name!=='Juan'?db.name:'')}"><div class="spacer"></div><div class="row modal-actions">${button('Guardar','first-name-save','','primary')}</div>`);}
function joinModal(code=''){modal('Entra a la partida',`<p>Pide al anfitrión el código de ocho caracteres. Si se corta la conexión, la app reintenta sola y recupera tu asiento.</p><label>Código de sala</label><input id="room-code" maxlength="8" value="${esc(code)}" placeholder="ABCD2345" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px"><label>Tu nombre</label><input id="join-name" value="${esc(db.name)}" maxlength="40"><label>Tu deck</label><select id="join-deck">${optionDecks()}</select><div class="spacer"></div>${button('Unirme →','join-room','','primary')}<p class="small" style="margin-top:15px">Quien conozca el código puede ocupar un asiento libre. El anfitrión controla el estado de la mesa.</p>`);}
function networkCallbacks(){return {connected:r=>{online=true;toast('Conectado a la sala '+r);go('mesa');},welcome:id=>{actor=id;},roster:p=>{lobby=p;if(route==='mesa')render();},state:s=>{game=s;online=true;if(MN.isHost){db.saved=s;save();}if(route==='mesa')render();setTimeout(autoResolve,0);},error:toast,status:msg=>{toast(msg);render();},disconnected:msg=>{toast(msg);render();},chat:m=>{chats.push(m);chats=chats.slice(-100);if(route==='mesa')render();},peek:cards=>{privateLibrary=cards;libraryModal();}};}
// Daño de comandante recibido, como el escudo del avatar en MTGO: «2 de 21 — Tana (Ana)».
function cmdDamage(q){const who=id=>{const o=game.players.find(x=>x.id===id);const c=o&&[...o.command,...o.battlefield,...o.graveyard,...o.exile].find(x=>x.isCommander);return (c?cardName(c):'Comandante')+' ('+(o?.name||'?')+')';};return Object.entries(q.commanderDamage||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([id,n])=>({n,label:who(id)}));}
function cmdBadge(q){const l=cmdDamage(q);if(!l.length)return '';const tip='Daño de comandante recibido: '+l.map(x=>x.n+' de 21 — '+x.label).join('; ');return button(`🛡 ${l[0].n}/21`,'player-info',`data-player="${esc(q.id)}" title="${esc(tip)}" aria-label="${esc(tip)}"`,'ghost cmd-badge'+(l[0].n>=15?' danger':''));}
function seatLife(q){return `<div class="seat-life"><button data-action="life" data-player="${esc(q.id)}" data-delta="-1" aria-label="Quitar una vida a ${esc(q.name)}" ${canControl(q.id)?'':'disabled'}>−</button><span class="life">${q.life}<small>VIDAS</small></span><button data-action="life" data-player="${esc(q.id)}" data-delta="1" aria-label="Añadir una vida a ${esc(q.name)}" ${canControl(q.id)?'':'disabled'}>＋</button></div>`;}
function opponentSeat(q){return `<article class="opponent-seat ${q.id===game.activePlayerId?'current':''}"><header class="seat-header"><div><span class="seat-status">${q.id===game.activePlayerId?'● TURNO ACTIVO':q.bot?'BOT':'OPONENTE'}</span><strong>${esc(q.name)}${game.monarch===q.id?' <span title="Monarca: roba una carta extra en su paso final">👑</span>':''}</strong>${cmdBadge(q)}</div>${seatLife(q)}</header><div class="opponent-counts"><span title="Cartas en mano">▱ Mano <b>${q.handCount??q.hand.length}</b></span><span title="Cartas en biblioteca">▤ Mazo <b>${q.libraryCount??q.library.length}</b></span>${button(`◇ Cementerio <b>${q.graveyard.length}</b>`,'zone',`data-zone="graveyard" data-player="${esc(q.id)}" aria-label="Ver el cementerio de ${esc(q.name)}"`,'ghost zone-peek')}${q.exile.length?button(`✧ Exilio <b>${q.exile.length}</b>`,'zone',`data-zone="exile" data-player="${esc(q.id)}" aria-label="Ver el exilio de ${esc(q.name)}"`,'ghost zone-peek'):''}<span title="Veneno">☣ <b>${q.poison}</b></span>${button('Detalles','player-info',`data-player="${esc(q.id)}"`,'ghost')}</div><div class="opponent-field"><div class="opponent-command"><span class="micro-label">Mando</span>${q.command.map((c,i)=>playcard(c,'command',i,q.id)).join('')||'<span class="empty-command" aria-label="Comandante en otra zona">◇</span>'}</div><div class="opponent-battle"><span class="micro-label">Campo · ${q.battlefield.length}</span><div class="card-strip">${q.battlefield.map((c,i)=>playcard(c,'battlefield',i,q.id)).join('')||'<div class="opponent-empty">Sin permanentes</div>'}</div></div></div>${q.eliminated?'<span class="warning small">Umbral de derrota alcanzado</span>':''}</article>`;}
function fieldLane(p,kind,label,hint){const cards=p.battlefield.map((c,i)=>({c,i})).filter(({c})=>kind==='creatures'?/Creature/.test(c.type_line||''):kind==='lands'?/Land/.test(c.type_line||'')&&!/Creature/.test(c.type_line||''):!/Creature|Land/.test(c.type_line||''));return `<section class="field-lane lane-${kind}" data-field-row="${kind}" data-drop="battlefield"><header><span>${label}</span><span class="lane-count">${cards.length}</span></header><div class="card-strip">${cards.map(({c,i})=>playcard(c,'battlefield',i,p.id)).join('')||`<div class="lane-empty"><span aria-hidden="true">${kind==='creatures'?'⚔':kind==='lands'?'◈':'✧'}</span><small>${hint}</small></div>`}</div></section>`;}
function publicPile(p,zone,label,symbol){const top=p[zone].at(-1),art=top?imgURL(top):'';return `<button class="zone-pile ${zone}" data-drop="${zone}" data-action="zone" data-zone="${zone}" aria-label="Abrir ${label}, ${p[zone].length} cartas"><span class="pile-label">${label}</span><span class="pile-visual">${art?`<img src="${esc(art)}" alt="${esc(cardName(top))}" loading="lazy">`:`<span class="pile-empty-symbol" aria-hidden="true">${symbol}</span>`}<span class="pile-count">${p[zone].length}</span></span><small>${top?esc(cardName(top)):'Sin cartas'}</small></button>`;}
function tablePrefs(){return {size:['small','normal','large'].includes(db.tablePrefs?.size)?db.tablePrefs.size:'normal',handFolded:db.tablePrefs?.handFolded===true};}
function poolText(pool){return MC.COLORS.filter(c=>pool[c]).map(c=>`${pool[c]} {${c}}`).join(' · ')||'Vacía';}
function responsePanel(){const r=MC.responseStatus(game);return `<div class="response-panel"><div class="row between"><strong>Ronda de respuestas</strong>${button(r.enabled?'Desactivar':'Activar','response-mode',`${canControl(game.activePlayerId)?'':'disabled'} data-enabled="${!r.enabled}"`,'ghost')}</div><small>Confirmaciones opcionales para el hechizo superior. No valida todas las reglas de prioridad.</small>${r.enabled&&r.spellId?game.players.filter(q=>r.pendingIds.includes(q.id)||r.passedIds.includes(q.id)).map(q=>`<div class="response-seat"><span>${r.passedIds.includes(q.id)?'✓':'…'} ${esc(q.name)}</span>${canControl(q.id)?button(r.passedIds.includes(q.id)?'Retirar pase':q.bot?'Confirmar bot':'Paso','response-pass',`data-player="${esc(q.id)}" data-pass="${!r.passedIds.includes(q.id)}"`,'ghost'):''}</div>`).join(''):''}</div>`;}
function tablePrompt(){const r=MC.responseStatus(game);let message;const waiting=(game.prompts||[])[0];if(waiting){const who=game.players.find(q=>q.id===waiting.playerId);return `<div class="table-prompt" role="status"><span aria-hidden="true">◈</span><div><strong>Elección pendiente</strong><p>${esc(who?.name||'')}: ${esc(waiting.text)}</p>${myPrompt()?button('Elegir ahora','open-prompt','','primary'):''}</div></div>`;}if(game.stack.length)message=r.enabled?(r.ready?'Todos confirmaron. El jugador activo puede resolver el hechizo superior.':'Esperando respuestas: '+game.players.filter(q=>r.pendingIds.includes(q.id)).map(q=>q.name).join(', ')+'. Puedes lanzar una respuesta desde tu mano.'):'Hay un hechizo en la pila. Acuerden las respuestas antes de resolver.';else if(game.pendingCombat)message='Combate pendiente: acuerden bloqueos y confirmen el daño.';else message=MC.PHASES[game.phase]+': '+['Endereza, revisa el mantenimiento y roba cuando corresponda.','Juega tu tierra y prepara tus hechizos.','Elige atacantes y acuerda los bloqueos.','Puedes jugar permanentes y preparar tu siguiente turno.','Revisa habilidades del paso final.','Ajusta la mano y el daño temporal antes de pasar.'][game.phase];return `<div class="table-prompt" role="status"><span aria-hidden="true">◈</span><div><strong>¿Qué sigue?</strong><p>${esc(message)}</p></div></div>`;}
function autoPayModal(c,zone,owner,opts={}){const p=game.players.find(q=>q.id===owner),plan=MC.autoPaymentPlan(game,owner,c.iid,zone,{cast:opts});pendingAutoPay={owner,iid:c.iid,from:zone,landIds:plan.landIds,revision:game.revision,opts};modal('Revisar pago automático',`<h3>${esc(cardName(c))}</h3><p>Coste impreso: ${esc(c.mana_cost||'Sin coste')} · Impuesto: ${plan.tax}</p><p class="small">Usa primero tu reserva y después tus fuentes de maná (tierras básicas, duales y artefactos sencillos). Comprueba descuentos, aumentos y otras condiciones de la mesa; no se calculan automáticamente.</p>${plan.ok?`<h4>Fuentes que se girarán · ${plan.landIds.length}</h4><div class="payment-sources">${plan.landIds.map(id=>{const land=p.battlefield.find(x=>x.iid===id);return `<div>${imgURL(land)?`<img src="${esc(imgURL(land))}" alt="${esc(cardName(land))}">`:''}<span>${esc(cardName(land))} → +${'{'+(plan.colors?.[id]?.color||MC.simpleLandMana(land))+'}'.repeat(plan.colors?.[id]?.amount||1)}</span></div>`;}).join('')||'<p>No hace falta girar tierras.</p>'}</div><p>Reserva actual: <b>${esc(poolText(plan.manaBefore))}</b><br>Reserva después: <b>${esc(poolText(plan.manaAfter))}</b></p><div class="row modal-actions">${button('Confirmar pago y lanzar','auto-cast-confirm','','primary')}</div>`:`<p class="note warning">${esc(plan.reason)}</p>`}<div class="spacer"></div>${button('Volver a la carta','auto-cast-back','','ghost')}`);}
function tableSummary(){modal('Resumen de la mesa',`<p>Daño de comandante recibido por jugador. Cada columna identifica al controlador del comandante de origen; comandantes múltiples requieren registro manual separado.</p><div class="summary-scroll"><table class="game-summary"><thead><tr><th>Jugador</th><th>Vidas</th><th>Veneno</th><th>Mano</th>${game.players.map(q=>`<th>De ${esc(q.name)}</th>`).join('')}</tr></thead><tbody>${game.players.map(p=>`<tr><th>${esc(p.name)}</th><td>${p.life}</td><td>${p.poison}</td><td>${p.handCount??p.hand.length}</td>${game.players.map(q=>`<td>${p.id===q.id?'—':p.commanderDamage[q.id]||0}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">21 de daño de un mismo comandante alcanza el umbral de derrota. Este contador no modifica vidas; ajusta ambas cifras desde Detalles del jugador.</p>`);}
function table(){if(online&&!game)return `<div class="section-head" style="margin-top:0"><h2>La mesa está abierta</h2><span class="badge">Sala online</span></div><div class="panel"><span class="eyebrow">COMPARTE ESTE CÓDIGO</span><div class="stat" style="letter-spacing:7px">${esc(MN.room)}</div><div class="row">${button('Copiar código','copy-room')}${button('Salir de la sala','leave-online','','ghost')}</div><div class="spacer"></div><div class="player-grid">${(lobby||[]).map(p=>`<div class="player"><strong>${esc(p.name)}</strong><p class="small">${p.bot?'Asiento libre · bot al iniciar':p.connected?'Conectado':'Desconectado'}</p></div>`).join('')}</div><p style="margin-top:18px">Los asientos libres se completarán con bots. Una vez iniciada la mesa, solo podrán reconectar los participantes originales.</p>${MN.isHost?button('Comenzar partida','start-online','','primary'):'<p class="gold">Esperando al anfitrión…</p>'}</div>`;
if(!game)return `<div class="section-head" style="margin-top:0"><h2>Tu próxima partida empieza aquí</h2></div><div class="empty"><span style="font-size:55px;color:var(--gold)">◇</span><h2>Hay un lugar para ti</h2><p>Invita a tus amigos o practica contra bots.<br>La mesa lleva las cuentas; tú haces la magia.</p><div class="row" style="justify-content:center">${button('Crear mesa','newgame','','primary')}${button('Unirme','join')}${db.saved?button('Retomar guardado','resume'):''}</div></div>`;
const p=game.players.find(p=>p.id===actor)||game.players[0],active=game.players.find(p=>p.id===game.activePlayerId);return `<div class="table-view cards-${tablePrefs().size}"><header class="table-heading"><div><span class="eyebrow">${online?'SALA '+esc(MN.room):'MESA LOCAL'} · TURNO ${game.turn}</span><h2>${esc(active.name)} tiene el turno</h2></div><div class="row table-toolbar">${online&&!MN.isHost&&!MN.connected?button('↻ Reconectar','rejoin','','primary'):''}${button('✦ Tips','table-tips','','tips-button')}${button('Vista','table-view-settings','','ghost')}${button('Resumen','table-summary','','ghost')}${button('Guardar / salir','pause')}${button('Finalizar','endgame','','ghost')}</div></header><div class="table-turnbar"><div class="phasebar" aria-label="Fases del turno">${MC.PHASES.map((f,i)=>`<span class="${game.phase===i?'active':''}" ${game.phase===i?'aria-current="step"':''}>${i+1}<b>${esc(f)}</b></span>`).join('')}</div><div class="turn-actions">${canControl(active.id)?active.bot?button('▶ Turno del bot','botturn','','primary'):button('Siguiente fase →','phase','','primary'):''}${canControl(active.id)?button('Pasar turno','turn','','ghost'):''}</div></div>${tablePrompt()}${game.winnerId?`<div class="note table-result">${esc(game.players.find(q=>q.id===game.winnerId).name)} es el último jugador con vida. Finaliza la partida para guardar el resultado.</div>`:''}${game.pendingCombat?combatPanel():''}<div class="commander-playmat"><div class="opponents-row" aria-label="Oponentes y campos públicos">${game.players.filter(q=>q.id!==actor).map(opponentSeat).join('')||'<div class="solo-banner">PRÁCTICA EN SOLITARIO · TU MESA, A TU RITMO</div>'}</div><div class="table-divider"><span>CAMPO DE BATALLA</span><span class="divider-sigil" aria-hidden="true">✦</span><span>COMMANDER · MESA LIBRE</span></div><div class="own-seat-header"><div class="own-identity"><span class="seat-status">${p.id===active.id?'● TU TURNO':'TU ASIENTO'}</span><strong>${esc(p.name)}${game.monarch===p.id?' <span title="Monarca">👑</span>':''}</strong><small>☣ ${p.poison} veneno · ${p.battlefield.length} permanentes</small>${cmdBadge(p)}</div>${seatLife(p)}<div class="own-seat-actions">${button('Detalles','player-info',`data-player="${esc(p.id)}"`,'ghost')}${!online?`<select id="actor-select" aria-label="Jugador controlado">${game.players.map(q=>`<option value="${esc(q.id)}" ${q.id===actor?'selected':''}>Controlar: ${esc(q.name)}</option>`).join('')}</select>`:''}</div>${p.eliminated?'<span class="warning small">Umbral de derrota alcanzado</span>':''}</div><div class="playmat-layout"><aside class="zone-rail" aria-label="Tus zonas"><section class="library-slot" data-drop="library"><span class="pile-label">Biblioteca</span><button class="library-back" data-action="draw" aria-label="Robar carta de tu biblioteca"><span class="back-ornament" aria-hidden="true">✦</span><strong>${p.libraryCount??p.library.length}</strong><small>ROBAR CARTA</small></button>${button('Buscar','library','','ghost')}</section><section class="command-slot" data-drop="command"><span class="pile-label">Zona de mando</span><div class="command-card">${p.command.map((c,i)=>playcard(c,'command',i,p.id)).join('')||'<div class="empty-command"><span>◇</span><small>En otra zona</small></div>'}</div><small class="commander-tax">Impuesto <b>+${p.commanderCasts*2}</b></small></section>${publicPile(p,'graveyard','Cementerio','◇')}${publicPile(p,'exile','Exilio','✧')}</aside><div class="your-field"><div class="field-heading"><h3>Tu campo</h3><div class="row">${button('＋ Ficha','token','','ghost')}${button('⚔ Atacar','attack',`${game.activePlayerId!==actor?'disabled':''}`)}</div></div>${fieldLane(p,'creatures','Criaturas','Tus criaturas se despliegan aquí')}<div class="support-lanes">${fieldLane(p,'lands','Tierras','Tu base de maná')}${fieldLane(p,'other','Otros permanentes','Artefactos, encantamientos y más')}</div><p class="field-guidance">Toca una carta para ver sus opciones. Mantén pulsada una carta tuya y arrástrala a su zona.</p></div><aside class="table-tools"><section class="mana-station"><div class="station-heading"><h3>Reserva de maná · ${MC.COLORS.reduce((n,c)=>n+p.mana[c],0)}</h3>${button('Vaciar','mana-clear',MC.COLORS.some(c=>p.mana[c])?'':'disabled','ghost')}</div><div class="mana-grid">${MC.COLORS.map(c=>`<div class="mana-cell ${p.mana[c]?'has':''}">${button('−','mana',`data-color="${c}" data-delta="-1" ${p.mana[c]?'':'disabled'} aria-label="Quitar un maná ${c}"`)}<span class="mana ${c}">${c}</span><b aria-label="${p.mana[c]} de ${c}">${p.mana[c]}</b>${button('＋','mana',`data-color="${c}" data-delta="1" aria-label="Añadir un maná ${c}"`)}</div>`).join('')}</div><small>Girar tierras y artefactos de maná lo añade solo. La reserva se vacía al terminar cada fase (regla 106.4): gira lo que vayas a usar en esa fase.</small></section><section class="stack-station"><div class="station-heading"><h3>La pila</h3><span class="stack-total">${game.stack.length}</span></div><div class="spell-stack">${game.stack.slice().reverse().map((e,i)=>`<button class="stack-entry" data-action="stack-card" data-id="${esc(e.id)}">${imgURL(e.card,true)?`<img src="${esc(imgURL(e.card,true))}" alt="" loading="lazy">`:''}<div><small>${i===0?'PRÓXIMO EN RESOLVER':'EN ESPERA'}</small><strong>${esc(cardName(e.card))}${e.ability?' · habilidad':''}</strong>${e.ability?`<small class="stack-text">${esc((e.card.oracle_text||'').replace(/~/g,e.card.name).slice(0,140))}</small>`:''}<span class="badge">${e.effectStatus==='supported'?(e.optional?'Opcional':'Asistido'):'Manual'}</span></div></button>`).join('')||'<div class="stack-empty"><span aria-hidden="true">▱</span><strong>Pila vacía</strong><small>Los hechizos esperan aquí antes de resolverse.</small></div>'}</div>${game.stack.length?button('Resolver superior','resolve',(canControl(active.id)||canControl(game.stack.at(-1).controllerId))&&MC.responseStatus(game).ready?'':'disabled','primary'):''}${game.stack.at(-1)?.optional&&canControl(game.stack.at(-1).controllerId)?button('No usar','resolve-decline','','ghost'):''}${responsePanel()}</section></aside></div><section class="hand-zone" data-drop="hand"><header><div><span class="eyebrow">TU MANO</span><strong>${p.hand.length} cartas <small>· privada en multijugador</small></strong></div><div class="row">${button(tablePrefs().handFolded?'Ver mano':'Ocultar mano','hand-fold',`aria-expanded="${!tablePrefs().handFolded}"`,'ghost')}${button('Mulligan','mulligan',`${game.turn!==1?'disabled':''}`,'ghost')}${button('Barajar','shuffle','','ghost')}</div></header>${tablePrefs().handFolded?'<div class="hand-folded">Mano oculta en este dispositivo. Pulsa «Ver mano» para desplegarla.</div>':`<div class="card-strip hand-cards">${p.hand.map((c,i)=>playcard(c,'hand',i,p.id)).join('')||'<div class="hand-empty">Tu mano está vacía. Roba una carta desde tu biblioteca cuando corresponda.</div>'}</div>`}</section><footer class="playmat-caption"><span>✦ MESA COMMANDER</span><small>Pago y efectos complejos: resolución manual</small></footer></div><div class="table-activity"><details class="activity-panel"><summary><span>Registro de la mesa</span><span>${game.log.length} eventos · ver actividad</span></summary><div class="log">${game.log.slice(-22).reverse().map(e=>`<p><span class="gold">T${e.turn}</span> ${esc(e.text)}</p>`).join('')}</div></details>${online?`<details class="activity-panel chat-panel" open><summary><span>Chat de la mesa</span><span>${chats.length} mensajes</span></summary><div class="log">${chats.map(m=>`<p><strong>${esc(m.name)}:</strong> ${esc(m.text)}</p>`).join('')||'<p>Di hola a tu mesa.</p>'}</div><div class="searchrow"><input id="chat-text" maxlength="400" placeholder="Tu mensaje…" aria-label="Mensaje">${button('↑','chat')}</div><div class="row">${['¡Buena jugada!','Tu turno','En respuesta…'].map(m=>button(esc(m),'emote',`data-text="${esc(m)}"`,'ghost')).join('')}</div></details>`:''}</div>${mobileDock(p,active)}</div>`;}

function pendingBlocker(){const c=game.pendingCombat;if(!c)return null;return [...new Set(c.attackers.map(id=>(c.targets&&c.targets[id])||c.targetPlayerId))].find(id=>canControl(id)&&!(c.declared||[]).includes(id)&&!game.players.find(q=>q.id===id)?.bot)||null;}

 if(game.stack.length)suggestions.push('Hay '+game.stack.length+' hechizo(s) en la pila. El último se resuelve primero. Acuerden respuestas; no avances fase con la pila pendiente.');
 if(game.pendingCombat)suggestions.push('Hay un combate pendiente: confirma qué atacantes fueron bloqueados antes de aplicar el daño.');
 if(own&&[1,3].includes(game.phase))suggestions.push(p.landsPlayed?'Ya jugaste '+p.landsPlayed+' tierra(s) este turno. Solo juega otra si un efecto lo permite.':'Todavía no has jugado tu tierra de este turno. Busca una en tu mano.');
 suggestions.push('Tienes '+available+' tierra(s) sencilla(s) enderezada(s) y '+total+' maná en reserva. Jugar una tierra no produce maná: abre la carta y usa Girar · +1.');
 modal('Tips para tu mesa',`<span class="badge">Guía local · ${esc(MC.PHASES[game.phase])}</span><ol class="tips-list">${suggestions.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><details class="tips-more"><summary>Maná, comandante y acciones manuales</summary><p>Una tierra sencilla añade un maná de su tipo al girarse. Enderezarla no añade ni devuelve maná. Usa Girar sin maná si la gira otro efecto, y Ajustar para corregir la reserva.</p><p>Como en las reglas (106.4), el maná que no gastes se pierde al terminar cada fase.</p><p>Lanzar cobra el coste: usa tu reserva y, si no alcanza, gira tus tierras. «Sin pagar (corrección)» solo sirve para costes especiales o arreglos, y queda anotado. El impuesto de comandante añade dos manás genéricos por cada lanzamiento anterior desde la zona de mando.</p><p>Las tierras duales y los artefactos de maná sencillos te dejan elegir el color al girarlos. Las tierras con dolor, costes adicionales o efectos que cambien el maná se resuelven a mano.</p></details><div class="row"><a href="https://magic.wizards.com/en/how-to-play" target="_blank" rel="noopener noreferrer">Guía oficial de Magic ↗</a>${button('Tutorial paso a paso','tutorial')}</div>`);
}
function tutorial(step=0){const steps=[['Elige tu comandante','Abre Mis decks. Cada lista incluye al comandante dentro de sus 100 cartas. La identidad de color limita qué cartas puedes usar.'],['Prepara tu mesa','Crea una mesa local o una sala online. Tus amigos usan el código de ocho caracteres. Acuerden el nivel de poder antes de empezar.'],['Roba tu mano','Empiezas con siete cartas y 40 vidas. Si necesitas mulligan, pulsa Mulligan: robas siete y eliges cuáles van al fondo (en multijugador el primero es gratis).'],['Comienza el turno','Endereza tus permanentes y resuelve mantenimiento y robo. Al pasar turno, esta app endereza y roba automáticamente para el siguiente jugador. En el primer turno, usa Robar.'],['Juega una tierra','Abre una tierra de tu mano y pulsa Jugar tierra. El asistente limita a una por turno; usa Mover si un efecto permite más.'],['Produce maná','Abre una tierra básica o sencilla y pulsa Girar · +1: su maná se añade automáticamente. Para girarla por otro efecto usa Girar sin maná. Las tierras con elecciones o condiciones se resuelven manualmente.'],['Lanza un hechizo','Abre una carta y pulsa Lanzar (o arrástrala al campo): se cobra su coste. Va a la pila. El comandante tiene un coste adicional por cada lanzamiento anterior desde la zona de mando.'],['Resuelve la pila','Acuerden prioridad por chat. El jugador activo resuelve la carta superior. Si la app entiende la carta (marca «Asistido»), te pide los objetivos y aplica el efecto; si no, aplícalo a mano.'],['Entra en combate','Selecciona atacantes y un defensor. El defensor elige un bloqueador por atacante (los bots lo hacen solos). Al aplicar el daño la app resuelve criaturas, dañar primero, arrollar, toque mortal y vínculo vital.'],['Guarda tu historia','La mesa local se guarda tras cada acción. Finaliza para registrar un resultado. Exporta un respaldo si vas a cambiar de dispositivo.']];const [title,body]=steps[step];modal(`Paso ${step+1} de 10 · ${title}`,`<p>${body}</p><div class="row between">${step?button('← Anterior','tutorial-step',`data-step="${step-1}"`):'<span></span>'}${step<9?button('Siguiente →','tutorial-step',`data-step="${step+1}"`,'primary'):button('Ir a la mesa','tutorial-end','','primary')}</div>`);}
async function handle(el){const a=el.dataset.action,d=el.dataset;switch(a){
case 'nav':editing=null;if($('#modal').open)close();go(d.route);break;
case 'close':close();break;
case 'settings':settings();break;
case 'save-settings':db.name=$('#settings-name').value.trim()||'Planeswalker';db.nameConfirmed=true;save();close();render();break;
case 'first-name-save':{const v=$('#first-name').value.trim();if(!v)throw Error('Escribe tu nombre.');db.name=v.slice(0,40);db.nameConfirmed=true;save();close();render();break;}
case 'newgame':newGameModal();break;
case 'practice':newGameModal('starter-rats');break;
case 'deck-play':newGameModal(d.id);break;
case 'join':joinModal();break;
case 'start-setup':{if(online||game){toast('Guarda y sal de la mesa actual antes de crear otra.');break;}const deck=deckBy($('#game-deck').value);if(!deck?.commander||!deck.cards.length)throw Error('Tu deck necesita un comandante y cartas.');const name=$('#player-name').value.trim()||'Planeswalker',n=+$('#player-count').value,type=$('#game-type').value;db.name=name;const players=Array.from({length:n},(_,i)=>({id:'p'+(i+1),name:i===0?name:type==='hotseat'?'Jugador '+(i+1):'Bot '+i,bot:i>0&&type!=='hotseat',deck:i===0?deck:MD.defaultDecks()[0]}));close();actor='p1';chats=[];if(type==='online'){online=true;lobby=players;go('mesa');try{await MN.create({players},networkCallbacks());}catch(e){online=false;lobby=null;render();throw e;}}else{online=false;game=MC.createGame({players});db.saved=game;save();go('mesa');}break;}
case 'join-room':{if(game||online)throw Error('Sal de la mesa actual antes de unirte.');const code=$('#room-code').value,name=$('#join-name').value.trim()||'Invitado',deck=deckBy($('#join-deck').value);if(!deck?.commander)throw Error('Selecciona un deck con comandante.');close();online=true;lobby=[];go('mesa');try{await MN.join(code,{name,deck},networkCallbacks());}catch(e){online=false;render();throw e;}break;}
case 'start-online':MN.start();break;
case 'rejoin':MN.rejoin();toast('Reconectando…');render();break;
case 'reopen-room':{if(game||online)throw Error('Sal de la mesa actual antes de reabrir la sala.');online=true;actor='p1';chats=[];go('mesa');try{await MN.resumeHost(networkCallbacks());toast('Sala '+MN.room+' reabierta. Tus amigos se reconectan solos.');}catch(e){online=false;render();throw e;}break;}
case 'forget-room':MN.forget();render();break;
case 'guest-return':joinModal(MN.savedGuest()?.room||'');break;
case 'leave-online':MN.reset();online=false;lobby=null;game=null;go('inicio');break;
case 'copy-room':await copy(MN.room);break;
case 'resume':if(game||online)throw Error('Sal de tu mesa actual antes de recuperar otra.');game=MD.clone(db.saved);game.mode='free';online=false;actor='p1';go('mesa');toast('Guardado recuperado como mesa local.');break;
case 'pause':modal('Guardar y salir',`<p>${online&&!MN.isHost?'Tu asiento puede reconectar desde este navegador mientras el anfitrión siga conectado.':'El estado actual queda guardado en este dispositivo para continuar como mesa local.'}</p>${online&&MN.isHost?'<p class="warning">Tus invitados quedarán esperando. Desde Inicio podrás reabrir la sala con el mismo código y volverán a su asiento solos.</p>':''}${button('Guardar y volver al inicio','confirm-pause','','primary')}`);break;
case 'confirm-pause':if(!online||MN.isHost){db.saved=game;save();}MN.reset();online=false;game=null;lobby=null;close();go('inicio');break;
case 'endgame':if(online&&!MN.isHost)throw Error('El anfitrión registra el resultado.');modal('Registra esta partida',`<label>Ganador</label><select id="winner"><option value="">Sin ganador / cancelada</option>${game.players.map(p=>`<option value="${esc(p.id)}" ${game.winnerId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><p class="small">Se guardará el resultado en tu historial local y se cerrará la mesa.</p>${button('Guardar resultado y finalizar','confirm-end','','primary')}`);break;
case 'confirm-end':MN.forget();db.history.push({id:game.id,date:new Date().toISOString(),players:game.players.map(p=>({id:p.id,name:p.name})),winnerId:$('#winner').value,turn:game.turn});db.saved=null;save();MN.reset();game=null;online=false;lobby=null;close();go('historial');break;
case 'life':act('LIFE',{delta:+d.delta},d.player);break;
case 'draw':if(el.closest?.('#modal'))close();act('DRAW',{count:1});break;
case 'goto-blocks':document.querySelector('.combat-panel')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'prompt-later':snoozedPrompt=d.id;close();toast('Elección pendiente: pulsa ◈ Elegir cuando quieras.');break;
case 'mulligan':close();if(act('MULLIGAN'))toast('Mulligan hecho: tienes una mano nueva de 7.');break;
case 'shuffle':if(el.closest?.('#modal'))close();act('SHUFFLE');break;
case 'phase':{if(act('NEXT_PHASE',{},game.activePlayerId)&&game.phase===2&&!game.pendingCombat&&!game.stack.length&&game.activePlayerId===actor&&canAttackWith(game.players.find(q=>q.id===actor)).length)attackModal();break;}
case 'turn':if(el.closest?.('#modal'))close();act('NEXT_TURN',{},game.activePlayerId);break;
case 'resolve':{const entry=game.stack.at(-1);const plan=entry?MC.effectPlan(game,entry):null;if(plan?.targeted.length){modal('Elige objetivos · '+cardName(entry.card),`<p class="small">La app aplicará: ${plan.steps.map(x=>esc(x.label)).join(' · ')}.</p>${plan.targeted.map((t,i)=>`<label>${esc(t.label)}</label>${t.options.length?`<select class="effect-target" data-index="${i}">${t.options.map((o,j)=>`<option value="${j}">${esc(o.label)}</option>`).join('')}</select>`:'<p class="warning small">No hay objetivos legales: resuelve a mano.</p>'}`).join('')}<div class="spacer"></div><div class="row modal-actions">${plan.targeted.every(t=>t.options.length)?button('Resolver con estos objetivos','resolve-target','','primary'):''}${button('Resolver y aplicar a mano','resolve-manual','','ghost')}</div>`);}else act('RESOLVE',{},resolver());break;}
case 'resolve-target':{const entry=game.stack.at(-1),plan=MC.effectPlan(game,entry);const targets=[...document.querySelectorAll('.effect-target')].map(el=>plan.targeted[+el.dataset.index].options[+el.value].target);close();act('RESOLVE',{targets},resolver());startAutoResolve();break;}
case 'resolve-manual':close();act('RESOLVE',{manual:true},resolver());break;
case 'mana':act('MANA',{color:d.color,delta:Number(d.delta||1)});break;
case 'mana-clear':act('MANA',{clear:true});break;
case 'table-tips':tableTips();break;
case 'table-menu':tableMenu();break;
case 'table-log':modal('Registro de la mesa',`<div class="log">${game.log.slice(-60).reverse().map(e=>`<p><span class="gold">T${e.turn}</span> ${esc(e.text)}</p>`).join('')}</div>`);break;
case 'table-chat':modal('Chat de la mesa',`<div class="log chat-log">${chats.map(m=>`<p><strong>${esc(m.name)}:</strong> ${esc(m.text)}</p>`).join('')||'<p>Di hola a tu mesa.</p>'}</div><div class="searchrow"><input id="chat-text" maxlength="400" placeholder="Tu mensaje…" aria-label="Mensaje">${button('↑','chat')}</div><div class="row">${['¡Buena jugada!','Tu turno','En respuesta…'].map(m=>button(esc(m),'emote',`data-text="${esc(m)}"`,'ghost')).join('')}</div>`);break;
case 'jump':document.querySelector(d.target)?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'auto-cast':{const extra=extraCostPayload(),opts=castOptsPayload();autoPayModal(selectedCard,selectedZone,d.owner,opts);pendingAutoPay.extra=extra;break;}
case 'auto-cast-confirm':{const plan=pendingAutoPay;if(!plan)throw Error('Vuelve a revisar el pago.');pendingAutoPay=null;close();if(act('CAST',{iid:plan.iid,from:plan.from,autoPay:true,autoPayRevision:plan.revision,landIds:plan.landIds,...(plan.extra||{}),...(plan.opts||{})},plan.owner))startAutoResolve();break;}
case 'auto-cast-back':{const plan=pendingAutoPay,c=game.players.find(p=>p.id===plan?.owner)?.[plan?.from]?.find(c=>c.iid===plan.iid);if(!c)throw Error('La carta cambió de zona.');cardDetail(c,plan.from,plan.owner);break;}
case 'response-mode':act('SET_RESPONSE_CHECKS',{enabled:d.enabled==='true'},game.activePlayerId);break;
case 'response-pass':act('PASSED_RESPONSE',{pass:d.pass==='true'},d.player);break;
case 'stack-card':{const spell=game.stack.find(e=>e.id===d.id);if(spell)cardDetail(spell.card,'stack',null);break;}
case 'hand-fold':db.tablePrefs={...tablePrefs(),handFolded:!tablePrefs().handFolded};save();render();break;
case 'table-summary':tableSummary();break;
case 'table-view-settings':modal('Vista de la mesa',`<p>Elige el tamaño de las cartas de tu campo y mano. Esta preferencia solo cambia tu pantalla.</p><div class="row">${[['small','Compactas'],['normal','Normales'],['large','Grandes']].map(([size,label])=>button(label,'card-size',`data-size="${size}" aria-pressed="${tablePrefs().size===size}"`,tablePrefs().size===size?'primary':'')).join('')}</div>`);break;
case 'card-size':if(['small','normal','large'].includes(d.size)){db.tablePrefs={...tablePrefs(),size:d.size};save();close();render();}break;

case 'mana-apply':{const color=$('#mana-kind').value,delta=Number($('#mana-delta').value);if(!Number.isInteger(delta))throw Error('Usa una cantidad entera de maná.');close();act('MANA',{color,delta});break;}
case 'botturn':{if(!canControl(game.activePlayerId))throw Error('Solo el anfitrión ejecuta los bots.');const r=MC.botTurn(game,game.activePlayerId);if(r.error)throw Error(r.error);game=r.state;if(online)MN.sync(game);else{db.saved=game;save();render();}break;}
case 'game-card':{const p=game.players.find(p=>p.id===d.player),c=p[d.zone][+d.index];cardDetail(c,d.zone,d.player);break;}
case 'cast-card':case 'cast-paid':case 'cast-unpaid':{const c=selectedCard,z=selectedZone,extra=extraCostPayload(),opts=castOptsPayload();if(act('CAST',{iid:c.iid,from:z,...(a==='cast-paid'?{payMana:true}:a==='cast-unpaid'?{unpaid:true}:{}),...extra,...opts},d.owner)){close();startAutoResolve();}break;}
case 'cast-alt':{const c=selectedCard,z=selectedZone,i=+d.index,el=$(`#modal .alt-exile[data-index="${i}"]`),extra=extraCostPayload();const exile=el?[...el.selectedOptions].map(o=>o.value):[];close();if(act('CAST',{iid:c.iid,from:z,alt:i,exile,...extra,...castOptsPayload()},d.owner))startAutoResolve();break;}
case 'cycle':{const c=selectedCard;close();act('CYCLE',{iid:c.iid},d.owner);break;}
case 'ninjutsu':{const c=selectedCard,z=selectedZone,back=$('#modal .ninja-return')?.value;close();act('NINJUTSU',{iid:c.iid,from:z,returnIid:back},d.owner);break;}
case 'activate':{const c=selectedCard,i=+d.index;const pick=cls=>{const el=$(`#modal .${cls}[data-index="${i}"]`);return el?[...el.selectedOptions].map(o=>o.value):undefined;};const xs=$(`#modal .act-x[data-index="${i}"]`),col=$(`#modal .act-color[data-index="${i}"]`);const payload={iid:c.iid,index:i,sacrifice:pick('act-sac'),discard:pick('act-disc'),...(xs?{x:Number(xs.value)||0}:{}),...(col?{color:col.value}:{})};close();if(act('ACTIVATE',payload,d.owner))startAutoResolve();break;}

case 'prompt-pick':{const pr=myPrompt();if(!pr)break;const id=d.iid;if(promptPicks.has(id))promptPicks.delete(id);else{if(pr.max===1)promptPicks.clear();if(promptPicks.size>=pr.max)throw Error('Ya elegiste '+pr.max+'.');promptPicks.add(id);}document.querySelectorAll('#modal .prompt-card').forEach(b=>b.setAttribute('aria-pressed',String(promptPicks.has(b.dataset.iid))));const n=$('#prompt-count');if(n)n.textContent=promptPicks.size+' elegida(s)';break;}

case 'tap-card':{const id=selectedCard.iid,tapped=!selectedCard.tapped;close();act('TAP',{iid:id,tapped,produceMana:d.manual!=='true',...(d.color?{color:d.color}:{})},d.owner);break;}
case 'move-card':{const c=selectedCard,z=selectedZone,to=$('#move-to').value;close();act('MOVE',{iid:c.iid,from:z,to:to==='bottom'?'library':to,position:to==='bottom'?'bottom':'top'},d.owner);break;}

case 'player-info':{const p=game.players.find(p=>p.id===d.player);const cdl=cmdDamage(p);modal(p.name,`<p>Vidas: ${p.life} · Veneno: ${p.poison} · Lanzamientos del comandante: ${p.commanderCasts}</p><h4>Daño de comandante recibido</h4>${cdl.length?`<ul class="cmd-list">${cdl.map(x=>`<li class="${x.n>=15?'danger':''}"><b>${x.n} de 21</b> — ${esc(x.label)}</li>`).join('')}</ul>`:'<p class="small">Ningún comandante le ha hecho daño de combate.</p>'}${canControl(p.id)?`<div class="row">${button('− veneno','poison',`data-player="${esc(p.id)}" data-delta="-1"`)}${button('＋ veneno','poison',`data-player="${esc(p.id)}" data-delta="1"`)}</div><label>Daño recibido del comandante de</label><select id="damage-source">${game.players.filter(q=>q.id!==p.id).map(q=>`<option value="${esc(q.id)}">${esc(q.name)} · ${p.commanderDamage[q.id]||0}</option>`).join('')}</select><label>Ajuste de daño (usa negativo para corregir)</label><input id="damage-value" type="number" value="1"><div class="spacer"></div>${button('Registrar daño de comandante','commander-damage',`data-player="${esc(p.id)}"`)}<p class="small">Este contador no cambia vidas. Ajusta las vidas por separado.</p>`:''}`);break;}

case 'create-token':{const kind=$('#token-kind').value,count=Number($('#token-count').value);if(!Number.isInteger(count)||count<1||count>20)throw Error('Elige entre 1 y 20 fichas.');const payload={kind,name:$('#token-name').value.trim()||'Ficha',types:$('#token-types').value.trim(),count,colors:[...document.querySelectorAll('.token-color:checked')].map(x=>x.value),keywords:[...document.querySelectorAll('.token-kw:checked')].map(x=>x.value),text:$('#token-text').value,tapped:$('#token-tapped').checked};if(kind==='creature'){payload.power=Number($('#token-power').value);payload.toughness=Number($('#token-toughness').value);}close();act('TOKEN',payload);break;}

case 'attack':attackModal();break;
case 'skip-attack':close();if(game.phase===2&&!game.pendingCombat)act('NEXT_PHASE',{},game.activePlayerId);break;
case 'declare-attack':{const assignments=[...document.querySelectorAll('.attack-check:checked')].map(x=>({attackerId:x.value,targetPlayerId:attackTargetOf(x.value)}));if(!assignments.length)throw Error('Elige al menos una criatura o pulsa «No atacar».');close();if(act('COMBAT',{assignments}))startAutoResolve();break;}
case 'combat-resolve':{const summary=($('#combat-preview')?.querySelector('p')?.textContent)||'';if(act('RESOLVE_COMBAT',{confirm:true},game.activePlayerId)&&summary)toast('Combate: '+summary);break;}
case 'declare-blocks':{const def=d.def||game.pendingCombat.targetPlayerId;act('DECLARE_BLOCKS',{blocks:readBlocks(def)},def);break;}
case 'chat':{const v=$('#chat-text').value.trim();if(v){MN.chat(v);$('#chat-text').value='';}break;}
case 'emote':MN.chat(d.text);break;
case 'newdeck':{const id=MD.uid();db.decks.push({id,name:'Mi nueva estrategia',commander:null,cards:[],format:'commander'});save();editing=id;results=[];go('decks');break;}
case 'edit':editing=d.id;results=[];go('decks');break;
case 'backdecks':editing=null;render();break;
case 'rename':deckBy(editing).name=$('#deck-name').value.trim()||'Mi deck';save();render();toast('Deck guardado.');break;
case 'search':{const q=$('#card-query').value,lang=$('#card-lang').value;if(!q.trim())throw Error('Escribe una carta.');$('#search-results').innerHTML='<p class="loading">Buscando en el multiverso…</p>';try{results=await MD.searchCards(q,lang);}catch(e){results=[...new Map(db.decks.flatMap(d=>[d.commander,...d.cards]).filter(Boolean).filter(c=>(c.name+' '+(c.printed_name||'')).toLowerCase().includes(q.toLowerCase())).map(c=>[c.name,c])).values()];toast(results.length?'Mostrando coincidencias guardadas. La búsqueda remota no respondió.':e.message);}if($('#search-results'))$('#search-results').innerHTML=resultsHTML()||'<p class="muted">Sin coincidencias. Prueba un nombre en inglés o cambia el idioma.</p>';break;}
case 'add-card':if(deckBy(editing).cards.length>=249)throw Error('Límite de 250 cartas por deck.');deckBy(editing).cards.push(MD.clone(results[+d.index]));save();render();break;
case 'set-commander':deckBy(editing).commander=MD.clone(results[+d.index]);save();render();break;
case 'remove-card':deckBy(editing).cards.splice(+d.index,1);save();render();break;
case 'deck-detail':cardDetail(deckBy(editing).cards[+d.index]);break;
case 'result-detail':cardDetail(results[+d.index]);break;
case 'validate':{const v=MC.validateDeck(deckBy(editing));modal('Revisión de Commander',`<span class="badge">${v.valid?'Comprobaciones básicas correctas':'Requiere ajustes'}</span><ul class="checklist">${v.errors.map(e=>`<li class="warning">${esc(e)}</li>`).join('')}</ul><ul class="checklist">${v.warnings.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`);break;}
case 'delete-deck':modal('Eliminar deck',`<p>Se eliminará ${esc(deckBy(editing).name)} de este navegador. Tus partidas guardadas conservan sus cartas.</p>${button('Eliminar este deck','confirm-delete','','danger')}`);break;
case 'confirm-delete':db.decks=db.decks.filter(x=>x.id!==editing);editing=null;save();close();render();break;
case 'export-deck':{const deck=deckBy(editing);download('mesa-deck.txt',(deck.commander?'Commander\n1 '+deck.commander.name+'\n\n':'')+'Deck\n'+grouped(deck.cards).map(x=>x.n+' '+x.c.name).join('\n'),'text/plain');break;}
case 'import':importModal();break;
case 'import-tab':['text','url','json'].forEach(t=>$('#import-'+t).hidden=t!==d.tab);break;
case 'import-list':{const text=$('#deck-list').value,name=$('#import-name').value;el.disabled=true;try{const deck=await MD.resolveList(text,msg=>{if($('#import-progress'))$('#import-progress').textContent=msg;});deck.name=name.trim()||deck.name;db.decks.push(deck);save();editing=deck.id;close();go('decks');toast('Lista importada. Revisa el comandante y la validación.');}finally{el.disabled=false;}break;}
case 'import-url':{el.disabled=true;$('#import-progress').textContent='Cargando el deck y el arte de sus cartas…';try{const deck=await MD.archidekt($('#archidekt-url').value);db.decks.push(deck);save();editing=deck.id;close();go('decks');}catch(error){if($('#import-progress'))$('#import-progress').textContent=error.message;throw error;}finally{el.disabled=false;}break;}
case 'refresh-deck':{const old=deckBy(editing);el.disabled=true;try{const next=await MD.archidekt(old.source);next.id=old.id;db.decks[db.decks.indexOf(old)]=next;save();render();toast('Deck actualizado desde Archidekt.');}finally{el.disabled=false;}break;}
case 'export-all':download('mesa-commander-respaldo.json',db);toast('Respaldo exportado. Incluye información privada de la partida guardada.');break;
case 'flip-art':{const card=selectedCard;const img=$('#modal-body .card-detail img');if(img&&card.card_faces?.length>1){const face=img.dataset.face==='back'?'front':'back';const url=card.card_faces[face==='back'?1:0]?.image_uris?.normal;if(!url)throw Error('No hay imagen de la otra cara disponible.');img.src=url;img.dataset.face=face;}break;}
case 'translate-card':{const c=selectedCard;el.disabled=true;try{const data=await MD.request('https://api.scryfall.com/cards/search?q='+encodeURIComponent((c.oracle_id?'oracleid:'+c.oracle_id:'!"'+c.name.replaceAll('"','')+'"')+' lang:es')+'&unique=prints');const translated=MD.slim(data.data[0]);cardDetail({...c,...translated},selectedZone,selectedOwner);}catch{throw Error('No se encontró impresión en español o la consulta fue bloqueada. Puedes consultar la carta en Claude.');}finally{el.disabled=false;}break;}
case 'rulings':{if(!/^https:\/\/api\.scryfall\.com\/cards\/[a-f0-9-]+\/rulings$/.test(selectedCard.rulings_uri||''))throw Error('Actualiza esta carta desde Scryfall para consultar sus fallos oficiales.');const c=selectedCard;const r=await MD.request(c.rulings_uri);modal('Fallos · '+c.name,r.data.map(x=>`<p class="small"><strong>${esc(x.published_at)}</strong><br>${esc(x.comment)}</p>`).join('')||'<p>No hay fallos publicados para esta carta.</p>');break;}
case 'claude-card':{const c=selectedCard;const question='Explica en español esta carta de Magic: The Gathering para Commander. Distingue texto de carta y explicación; cita reglas si puedes y señala dudas. Carta: '+c.name+'\n'+(c.oracle_text||c.summary||'');modal('Consulta preparada para Claude',`<p class="small">Copia la pregunta y pégala en Claude. La app no envía tu mano ni tu partida a una API de IA.</p><textarea id="claude-prompt">${esc(question)}</textarea><div class="row">${button('Copiar pregunta','copy-prompt')}<a href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Abrir Claude ↗</a></div>`);break;}
case 'copy-prompt':await copy($('#claude-prompt').value);break;
case 'tutorial':tutorial();break;
case 'tutorial-step':tutorial(+d.step);break;
case 'tutorial-end':close();go('mesa');break;
case 'new-league':modal('Una liga entre amigos',`<label>Nombre de la liga</label><input id="league-name" placeholder="Los viernes de Commander"><label>Jugadores, uno por línea</label><textarea id="league-players" placeholder="Juan\nIván\n…"></textarea><div class="spacer"></div>${button('Crear liga','create-league','','primary')}`);break;
case 'create-league':{const players=[...new Set($('#league-players').value.split('\n').map(x=>x.trim().slice(0,40)).filter(Boolean))];if(players.length<2||players.length>32)throw Error('Incluye entre 2 y 32 jugadores diferentes.');db.tournaments.push({id:MD.uid(),name:$('#league-name').value.trim().slice(0,70)||'Mi liga',players,matches:[]});save();close();render();break;}
case 'league-result':modal('Registra el ganador',`<label>Ganador de la mesa</label><select id="league-winner">${db.tournaments[+d.index].players.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div class="spacer"></div>${button('Guardar victoria','save-league-result',`data-index="${d.index}"`,'primary')}`);break;
case 'save-league-result':db.tournaments[+d.index].matches.push($('#league-winner').value);save();close();render();break;
case 'league-undo':db.tournaments[+d.index].matches.pop();save();render();break;
case 'league-export':download('mesa-liga.json',db.tournaments[+d.index]);break;
case 'install':if(installPrompt){await installPrompt.prompt();installPrompt=null;}break;
}}
function canAttackWith(p){return (p?.battlefield||[]).filter(c=>MC.isCreature(c)&&!c.tapped&&(!c.sick||MC.hasKw(c,'Haste'))&&!MC.hasKw(c,'Defender'));}
function attackModal(){const p=game.players.find(q=>q.id===actor);const ready=canAttackWith(p);const creatures=p.battlefield.filter(MC.isCreature);
 const why=c=>c.tapped?'girada':MC.hasKw(c,'Defender')?'defensor':c.sick&&!MC.hasKw(c,'Haste')?'recién llegada':'';
 const opps=game.players.filter(q=>q.id!==actor&&!q.eliminated),multi=opps.length>1;
 const toSel=c=>multi?`<select class="attack-to" data-iid="${esc(c.iid)}" aria-label="A quién ataca ${esc(c.name)}">${opps.map(q=>`<option value="${esc(q.id)}">→ ${esc(q.name)}</option>`).join('')}</select>`:'';
 modal('Declara tus atacantes',`<label for="attack-target">${multi?'Atacar a (cambia todas; luego ajusta cada criatura)':'Defensor'}</label><select id="attack-target">${opps.map(q=>`<option value="${esc(q.id)}">${esc(q.name)} · ${q.life} vidas · ${q.battlefield.filter(x=>MC.isCreature(x)&&!x.tapped).length} posibles bloqueadores</option>`).join('')}</select><div class="spacer"></div><div class="row">${button('Todas','attack-select','data-checked="true"')}${button('Ninguna','attack-select','data-checked="false"','ghost')}</div><div class="combat-picker">${creatures.map(c=>{const r=why(c);return `<label class="combat-choice ${r?'unable':''}">${imgURL(c)?`<img src="${esc(imgURL(c))}" alt="" loading="lazy">`:''}<input class="attack-check" type="checkbox" value="${esc(c.iid)}" data-power="${MC.power(c,p)*(MC.hasKw(c,'Double strike')?2:1)}" ${r?'disabled':''}><strong>${esc(cardName(c))}</strong><small>${ptText(c,p)} ${kwText(c)}${r?' · '+r:''}</small>${r?'':toSel(c)}</label>`;}).join('')||'<p>No tienes criaturas en el campo.</p>'}</div><div class="row modal-actions"><p class="small attack-sum" id="attack-sum" aria-live="polite">${ready.length?'Elige atacantes.':'No tienes criaturas que puedan atacar.'}</p>${button('Declarar ataque','declare-attack','','primary')}${game.phase<=2?button('No atacar','skip-attack','','ghost'):''}</div>`);}
function attackTargetOf(iid){return document.querySelector(`.attack-to[data-iid="${CSS.escape(iid)}"]`)?.value||$('#attack-target')?.value;}
function updateAttackSum(){const el=$('#attack-sum');if(!el)return;const picked=[...document.querySelectorAll('.attack-check:checked')];if(!picked.length){el.textContent='Elige atacantes.';return;}const per={};for(const x of picked){const t=attackTargetOf(x.value);per[t]=(per[t]||0)+(Number(x.dataset.power)||0);}const name=id=>game.players.find(q=>q.id===id)?.name||'?';el.textContent=picked.length+' atacante(s) · si nadie bloquea: '+Object.entries(per).map(([id,n])=>esc(name(id))+' −'+n).join(', ');}
function readBlocks(def){return [...document.querySelectorAll('.block-select')].filter(el=>!def||el.dataset.def===def).filter(el=>el.value).map(el=>({attackerId:el.value,blockerId:el.dataset.blocker}));}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado.');}catch{modal('Copia este texto',`<textarea readonly>${esc(text)}</textarea>`);}}
// ——— Arrastrar cartas propias a sus zonas (ratón: arrastrar; táctil: mantener pulsado y arrastrar) ———
const ZONE_ES={battlefield:'Campo',hand:'Mano',graveyard:'Cementerio',exile:'Exilio',command:'Mando',library:'Biblioteca'};
let drag=null,suppressClickUntil=0,pendingResolve=null;
function beginDrag(){const d=drag;d.active=true;navigator.vibrate?.(12);d.el.classList.add('drag-source');document.body.classList.add('is-dragging');const img=d.el.querySelector('img');const g=document.createElement('div');g.className='drag-ghost';g.innerHTML=img?`<img src="${img.src}" alt="">`:`<span>${esc(d.el.getAttribute('aria-label')||'Carta')}</span>`;document.body.append(g);d.ghost=g;const bar=document.createElement('div');bar.className='drop-bar';bar.innerHTML=['battlefield','hand','graveyard','exile','command','library'].filter(z=>z!==d.zone).map(z=>`<div class="drop-chip" data-drop="${z}">${ZONE_ES[z]}</div>`).join('');document.body.append(bar);d.bar=bar;moveDrag(d.lx,d.ly);tickScroll();}
function dropTargetAt(x,y){return document.elementFromPoint(x,y)?.closest('[data-drop]')||null;}
function moveDrag(x,y){const d=drag;d.lx=x;d.ly=y;if(!d.active)return;d.ghost.style.transform=`translate(${x-36}px,${y-50}px) rotate(-4deg)`;const t=dropTargetAt(x,y);if(t!==d.over){d.over?.classList.remove('drop-over');t?.classList.add('drop-over');d.over=t;}}
function tickScroll(){if(!drag?.active)return;const y=drag.ly,h=innerHeight;const dockTop=document.querySelector('.mobile-dock')?.getBoundingClientRect().top??h;const v=y<130&&y>70?-14:(y>h-170&&y<dockTop-8)?14:0;if(v)scrollBy(0,v);requestAnimationFrame(tickScroll);}
function endDrag(drop){const d=drag;drag=null;d.el.classList.remove('drag-source');document.body.classList.remove('is-dragging');d.ghost?.remove();d.bar?.remove();d.over?.classList.remove('drop-over');suppressClickUntil=Date.now()+400;const to=drop&&drop.dataset.drop;if(to&&to!==d.zone)Promise.resolve(dropCard(d.zone,d.iid,to)).catch(err=>toast(err.message));}
async function dropCard(from,iid,to){const p=game.players.find(q=>q.id===actor),c=p[from].find(x=>x.iid===iid);if(!c)return;
 if(to==='battlefield'&&['hand','command'].includes(from)){
  if(MC.isLand(c)){if(!act('CAST',{iid,from}))toast('Si un efecto te deja jugar otra tierra, usa Mover en la carta.');return;}
  {const x=MFX.additionalCost(c);if(x&&(x.sacrifice||x.discard)){cardDetail(c,from,actor);toast('Elige el coste adicional y lánzala desde aquí.');return;}if(/\{X\}/.test(c.mana_cost||'')){cardDetail(c,from,actor);toast('Elige el valor de X y lánzala desde aquí.');return;}}
  // Arrastrar al campo lanza cobrando el coste; si no se puede pagar, no entra (abre la carta para ver por qué).
  if(act('CAST',{iid,from}))startAutoResolve();else cardDetail(c,from,actor);return;}
 act('MOVE',{iid,from,to:to,position:'top'});}
// Tras soltar un hechizo en el campo, se resuelve solo si eres el jugador activo y no hay ronda de respuestas.
function resolver(){const top=game?.stack.at(-1);return top&&canControl(top.controllerId)?top.controllerId:game.activePlayerId;}
function startAutoResolve(){pendingResolve=true;setTimeout(autoResolve,0);}
// Resuelve en cadena lo que pusiste en la pila (hechizo y sus disparos) mientras eres el jugador activo y no hay ronda de respuestas.
// Se detiene si hace falta elegir objetivos, si es un disparo opcional o si el objeto es de otro jugador.
function autoResolve(){if(!pendingResolve||!game)return;const top=game.stack.at(-1);const r=MC.responseStatus(game);if(!top||$('#modal').open||top.controllerId!==actor||game.activePlayerId!==actor||r.enabled||top.optional||game.prompts?.length){if(top&&top.controllerId!==actor)toast('En la pila: resuélvela cuando la mesa lo acuerde.');pendingResolve=null;return;}const before=game.revision;handle({dataset:{action:'resolve'},disabled:false});if(game.revision!==before)setTimeout(autoResolve,0);else pendingResolve=null;}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.playcard[data-drag="1"]');if(!el||e.button>0||$('#modal').open||!game)return;drag={el,zone:el.dataset.zone,iid:(game.players.find(q=>q.id===actor)?.[el.dataset.zone]||[])[+el.dataset.index]?.iid,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,pid:e.pointerId,touch:e.pointerType!=='mouse',active:false};if(!drag.iid){drag=null;return;}if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.active)beginDrag();},280);});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const far=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(!drag.active){if(drag.touch){if(far>10){clearTimeout(drag.timer);drag=null;}return;}if(far<8)return;drag.lx=e.clientX;drag.ly=e.clientY;beginDrag();}moveDrag(e.clientX,e.clientY);});
document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pid)return;clearTimeout(drag.timer);if(drag.active)endDrag(dropTargetAt(e.clientX,e.clientY));else drag=null;});
document.addEventListener('pointercancel',()=>{if(!drag)return;clearTimeout(drag.timer);if(drag.active)endDrag(null);else drag=null;});
document.addEventListener('touchmove',e=>{if(drag?.active)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.playcard'))e.preventDefault();});
document.addEventListener('dragstart',e=>{if(e.target.closest?.('.playcard'))e.preventDefault();});
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)Promise.resolve(handle(el)).catch(err=>toast(err.message||'No se pudo completar la acción.'));});
document.addEventListener('change',async e=>{if(e.target.classList?.contains('cz-pref')){const prefs={};document.querySelectorAll(`.cz-pref[data-iid="${CSS.escape(e.target.dataset.iid)}"]`).forEach(x=>prefs[x.dataset.key]=x.checked);act('COMMANDER_ZONES',{iid:e.target.dataset.iid,prefs});return;}if(e.target.id==='attack-target')document.querySelectorAll('.attack-to').forEach(x=>x.value=e.target.value);if(e.target.classList?.contains('attack-check')||e.target.classList?.contains('attack-to')||e.target.id==='attack-target')updateAttackSum();if(e.target.classList?.contains('block-select')){const pv=$('#combat-preview');if(pv)pv.innerHTML=combatPreview(readBlocks());}if(e.target.id==='token-kind')tokenKindChange();if(e.target.id==='actor-select'){actor=e.target.value;render();}if(e.target.id==='json-file'){try{const file=e.target.files[0];if(!file)return;if(file.size>15000000)throw Error('El respaldo supera 15 MB.');const value=JSON.parse(await file.text());const decks=value.version===1?value.decks:[value];if(!Array.isArray(decks)||decks.length>100)throw Error('Formato de respaldo no válido.');for(const d of decks){if(!d||!Array.isArray(d.cards)||d.cards.length>250||typeof d.name!=='string'||d.cards.some(c=>!c||typeof c.name!=='string'))throw Error('El archivo contiene decks no válidos.');}const imported=decks.map(d=>({...d,id:MD.uid()}));let hist=[],leagues=[],saved=null;
if(value.version===1){
 if(!Array.isArray(value.history)||value.history.length>10000||!Array.isArray(value.tournaments)||value.tournaments.length>100)throw Error('Historial o ligas no válidos.');
 hist=value.history.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.players)&&x.players.every(p=>p&&typeof p.name==='string')&&Number.isFinite(x.turn)&&typeof x.date==='string');
 leagues=value.tournaments.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.players)&&x.players.every(n=>typeof n==='string')&&Array.isArray(x.matches)&&x.matches.every(n=>x.players.includes(n)));
 if(value.saved){const g=value.saved;if(!g||!Array.isArray(g.players)||g.players.length<1||g.players.length>8||!Array.isArray(g.log)||!Array.isArray(g.stack)||!Array.isArray(g.appliedActionIds)||!Number.isInteger(g.revision)||!Number.isFinite(g.seed)||!Number.isInteger(g.turn)||!Number.isInteger(g.phase)||g.players.some(p=>!p||typeof p.id!=='string'||typeof p.name!=='string'||!Number.isFinite(p.life)||!Number.isFinite(p.poison)||!p.commanderDamage||!p.mana||MC.COLORS.some(c=>!Number.isFinite(p.mana[c]))||MC.ZONES.some(z=>!Array.isArray(p[z])||p[z].length>500||p[z].some(c=>!c||typeof c.iid!=='string'||typeof c.name!=='string')))||!g.players.some(p=>p.id===g.activePlayerId))throw Error('La partida guardada no tiene una estructura válida.');saved=g;}
}
db.decks.push(...imported);for(const x of hist)if(!db.history.some(y=>y.id===x.id))db.history.push(x);for(const x of leagues)if(!db.tournaments.some(y=>y.id===x.id))db.tournaments.push(x);if(saved&&!game&&!online)db.saved=saved;save();close();editing=null;go('decks');toast(imported.length+' decks importados'+(saved?' y partida recuperable.':'.'));
}catch(err){toast(err.message);}}});
document.addEventListener('input',e=>{if(e.target.id==='glossary-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('.glossary-item').forEach(x=>x.hidden=!x.dataset.search.includes(q));}if(e.target.id==='library-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('.library-row').forEach(x=>x.hidden=!x.dataset.name.includes(q));}});
document.addEventListener('error',e=>{if(e.target.tagName!=='IMG')return;const img=e.target;img.hidden=true;const fallback=document.createElement('span');fallback.className='art-unavailable';fallback.textContent=img.alt||'Arte no disponible';img.after(fallback);},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='card-query'){e.preventDefault();document.querySelector('[data-action="search"]').click();}if(e.key==='Enter'&&e.target.id==='chat-text'){e.preventDefault();MN.chat(e.target.value);}});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1).split('?')[0];render();});window.addEventListener('online',render);window.addEventListener('offline',render);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
save();render();
// Cada dispositivo elige su nombre la primera vez (antes todos empezaban como «Juan»).
if(!db.nameConfirmed)nameModal();
})();
</script></body></html>
